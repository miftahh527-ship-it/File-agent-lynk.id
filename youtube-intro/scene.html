<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Let.growww Intro</title>
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; width: 100vw; height: auto; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// =============================================================
//  Let.growww — YouTube intro (5 dtk) + layar "Perhatian"
//  render(t) menggambar satu frame pada waktu t (detik).
//  Dipakai oleh render.js (Playwright) untuk ekspor frame-by-frame,
//  dan bisa juga dibuka langsung di browser untuk preview (?preview).
// =============================================================
const W = 1920, H = 1080;
const INTRO = 5.0;          // durasi intro
const TOTAL = 13.0;         // intro + disclaimer
const FONT = '"Inter", "Inter Display", "DejaVu Sans", sans-serif';

const C = {
  bg1: '#06261C', bg2: '#0B4A35', bg3: '#021510',
  lime: '#B6F23A', mint: '#4ADE9B', teal: '#1FB58F',
  cream: '#F4FBEF', amber: '#FFC94A', muted: '#A9CBB9',
};

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const easeOutCubic = k => 1 - Math.pow(1 - k, 3);
const easeInOutCubic = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeInCubic = k => k * k * k;
const easeOutBack = (k, s = 1.9) => 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2);
const easeOutElastic = k => k === 0 ? 0 : k === 1 ? 1 :
  Math.pow(2, -10 * k) * Math.sin((k * 10 - 0.75) * (2 * Math.PI) / 3) + 1;

function rng(seed) { // mulberry32 — deterministik
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const R = rng(20261102);
const PARTICLES = Array.from({ length: 70 }, () => ({
  x: R() * W, y: R() * H, r: 1.5 + R() * 4, sp: 18 + R() * 55,
  ph: R() * Math.PI * 2, a: .15 + R() * .35, hue: R() < .5 ? C.lime : C.mint,
}));
const SPARKS = Array.from({ length: 22 }, (_, i) => ({
  ang: (i / 22) * Math.PI * 2 + R() * .3, dist: 120 + R() * 140, r: 2 + R() * 4, col: i % 2 ? C.lime : C.mint,
}));

function roundRect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ---------- background ----------
function background(t, glowK = 1) {
  const g = ctx.createRadialGradient(W / 2, H * .45, 50, W / 2, H / 2, W * .75);
  g.addColorStop(0, C.bg2); g.addColorStop(.55, C.bg1); g.addColorStop(1, C.bg3);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // grid halus (nuansa "data")
  ctx.save();
  ctx.globalAlpha = .06 * glowK;
  ctx.strokeStyle = C.mint; ctx.lineWidth = 1;
  const off = (t * 20) % 80;
  for (let x = -80 + off; x < W + 80; x += 80) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = -80 + off; y < H + 80; y += 80) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.restore();

  // partikel naik (tumbuh)
  ctx.save();
  for (const p of PARTICLES) {
    const y = ((p.y - t * p.sp) % H + H) % H;
    const x = p.x + Math.sin(t * 1.3 + p.ph) * 14;
    ctx.globalAlpha = p.a * glowK * (0.6 + 0.4 * Math.sin(t * 3 + p.ph));
    ctx.fillStyle = p.hue;
    ctx.beginPath(); ctx.arc(x, y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();

  // vignette
  const v = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, W * .7);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.55)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

// ---------- logo: lingkaran + 3 batang data + tunas ----------
// opts: ring, bars[3], stem, leaves, glow  (0..1)
function drawLogo(cx, cy, s, o) {
  ctx.save();
  ctx.translate(cx, cy); ctx.scale(s, s);

  // glow
  if (o.glow > 0) {
    const gg = ctx.createRadialGradient(0, 0, 20, 0, 0, 300);
    gg.addColorStop(0, `rgba(182,242,58,${.35 * o.glow})`);
    gg.addColorStop(1, 'rgba(182,242,58,0)');
    ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(0, 0, 300, 0, Math.PI * 2); ctx.fill();
  }

  // badge isi
  const fillK = clamp(o.ring * 1.2 - .2);
  if (fillK > 0) {
    ctx.globalAlpha = fillK;
    const bg = ctx.createLinearGradient(0, -160, 0, 160);
    bg.addColorStop(0, '#0F5A40'); bg.addColorStop(1, '#073424');
    ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(0, 0, 160, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // ring
  if (o.ring > 0) {
    const rg = ctx.createLinearGradient(-160, 160, 160, -160);
    rg.addColorStop(0, C.teal); rg.addColorStop(.5, C.mint); rg.addColorStop(1, C.lime);
    ctx.strokeStyle = rg; ctx.lineWidth = 12; ctx.lineCap = 'round';
    ctx.beginPath();
    const st = Math.PI / 2;
    ctx.arc(0, 0, 160, st, st + Math.PI * 2 * o.ring);
    ctx.stroke();
  }

  // clip ke dalam lingkaran
  ctx.save();
  ctx.beginPath(); ctx.arc(0, 0, 150, 0, Math.PI * 2); ctx.clip();

  // 3 batang data
  const base = 95, bw = 40, xs = [-62, -6, 50], hs = [62, 108, 160];
  const cols = [C.teal, C.mint, C.lime];
  for (let i = 0; i < 3; i++) {
    const k = o.bars[i];
    if (k <= 0) continue;
    const h = hs[i] * k;
    ctx.fillStyle = cols[i];
    roundRect(xs[i], base - h, bw, h + 30, 10);
    ctx.fill();
  }
  ctx.restore();

  // tunas tumbuh dari batang tertinggi
  const sx = 70, sy = base - 160; // atas batang ke-3
  if (o.stem > 0) {
    const k = o.stem;
    ctx.strokeStyle = C.lime; ctx.lineWidth = 9; ctx.lineCap = 'round';
    ctx.beginPath();
    // kurva bezier dipotong sesuai k
    const p0 = [sx, sy + 4], p1 = [sx + 2, sy - 30], p2 = [sx - 12, sy - 52];
    const steps = 30;
    for (let i = 0; i <= steps * k; i++) {
      const u = i / steps;
      const x = (1 - u) ** 2 * p0[0] + 2 * (1 - u) * u * p1[0] + u * u * p2[0];
      const y = (1 - u) ** 2 * p0[1] + 2 * (1 - u) * u * p1[1] + u * u * p2[1];
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  const leaf = (x, y, ang, k, col) => {
    if (k <= 0) return;
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.scale(k, k);
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(22, -28, 58, -4);
    ctx.quadraticCurveTo(26, 22, 0, 0);
    ctx.fill();
    ctx.strokeStyle = 'rgba(6,38,28,.45)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(4, 0); ctx.lineTo(44, -4); ctx.stroke();
    ctx.restore();
  };
  leaf(sx - 6, sy - 38, -0.55, o.leaves[0], C.lime);
  leaf(sx - 6, sy - 30, Math.PI + 0.55, o.leaves[1], C.mint);

  ctx.restore();
}

// ---------- teks ----------
function drawTitle(t, cx, cy) {
  const parts = [
    ['L', C.cream], ['e', C.cream], ['t', C.cream], ['.', C.lime],
    ['g', C.lime], ['r', C.lime], ['o', C.lime], ['w', C.lime], ['w', C.mint], ['w', C.teal],
  ];
  ctx.save();
  ctx.font = `800 150px ${FONT}`;
  ctx.textBaseline = 'alphabetic';
  const widths = parts.map(p => ctx.measureText(p[0]).width);
  const tracking = -2;
  const total = widths.reduce((a, b) => a + b, 0) + tracking * (parts.length - 1);
  let x = cx - total / 2;
  const t0 = 2.05;
  parts.forEach((p, i) => {
    const st = t0 + i * 0.045;
    let k = prog(t, st, st + .45);
    let dy = (1 - easeOutBack(k, 2.2)) * 120;
    // tiga "w" melompat satu-satu (sinkron dengan sfx "pop")
    if (i >= 7) {
      const bt = 2.72 + (i - 7) * 0.12;
      const bk = prog(t, bt, bt + .32);
      if (bk > 0 && bk < 1) dy -= Math.sin(bk * Math.PI) * 34;
    }
    ctx.save();
    ctx.beginPath(); ctx.rect(x - 20, cy - 180, widths[i] + 40, 220); ctx.clip();
    ctx.globalAlpha = clamp(k * 2);
    ctx.fillStyle = p[1];
    ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 6;
    ctx.fillText(p[0], x, cy + dy);
    ctx.restore();
    x += widths[i] + tracking;
  });
  ctx.restore();
}

function drawTagline(t, cx, cy) {
  const k = easeOutCubic(prog(t, 3.05, 3.65));
  if (k <= 0) return;
  ctx.save();
  ctx.font = `500 46px ${FONT}`;
  ctx.textAlign = 'center';
  ctx.letterSpacing = '6px';
  ctx.globalAlpha = k;
  ctx.fillStyle = C.cream;
  ctx.fillText('mari bertumbuh bersama', cx, cy + (1 - k) * 24);
  // garis bawah yang "tumbuh"
  const lk = easeInOutCubic(prog(t, 3.25, 3.9));
  const lw = 360 * lk;
  const lg = ctx.createLinearGradient(cx - 180, 0, cx + 180, 0);
  lg.addColorStop(0, C.teal); lg.addColorStop(1, C.lime);
  ctx.globalAlpha = 1;
  ctx.fillStyle = lg;
  roundRect(cx - lw / 2, cy + 30, lw, 6, 3); ctx.fill();
  ctx.restore();
}

function drawSparks(t, cx, cy, s, t0) {
  const k = prog(t, t0, t0 + .7);
  if (k <= 0 || k >= 1) return;
  ctx.save();
  for (const p of SPARKS) {
    const d = easeOutCubic(k) * p.dist * s;
    ctx.globalAlpha = (1 - k) * .9;
    ctx.fillStyle = p.col;
    ctx.beginPath();
    ctx.arc(cx + Math.cos(p.ang) * d, cy + Math.sin(p.ang) * d, p.r * (1 - k * .5), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

// ---------- INTRO (0–5 dtk) ----------
function intro(t) {
  background(t, clamp(t / .5));

  // logo: tengah -> naik & mengecil
  const mv = easeInOutCubic(prog(t, 1.85, 2.45));
  const cx = W / 2, cy = lerp(H / 2, 345, mv);
  let s = lerp(1.15, .78, mv);
  // "nafas" kecil saat daun muncul
  s *= 1 + .06 * Math.sin(prog(t, 1.55, 1.85) * Math.PI);
  const pop = easeOutBack(prog(t, .05, .55), 1.6);
  const bars = [0, 1, 2].map(i => easeOutElastic(prog(t, .62 + i * .25, 1.32 + i * .25)));
  drawLogo(cx, cy, s * (.6 + .4 * pop), {
    ring: easeInOutCubic(prog(t, .1, .75)),
    bars,
    stem: easeOutCubic(prog(t, 1.35, 1.6)),
    leaves: [easeOutBack(prog(t, 1.55, 1.85), 2.5), easeOutBack(prog(t, 1.62, 1.92), 2.5)],
    glow: prog(t, 1.5, 1.9) * (0.7 + .3 * Math.sin(t * 4)),
  });
  drawSparks(t, cx, cy, s, 1.58);

  drawTitle(t, W / 2, 720);
  drawTagline(t, W / 2, 815);

  // transisi: lingkaran lime menutup layar dari pusat logo
  const w1 = easeInCubic(prog(t, 4.45, 4.85));
  if (w1 > 0) {
    ctx.fillStyle = C.lime;
    ctx.beginPath(); ctx.arc(W / 2, 345, w1 * 1300, 0, Math.PI * 2); ctx.fill();
  }
}

// ---------- DISCLAIMER (5–13 dtk) ----------
function wrapLines(text, maxW) {
  const words = text.split(' '); const lines = []; let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

function disclaimer(t) {
  const lt = t - INTRO;
  background(t, 1);

  const inK = (a, d = .5) => easeOutCubic(prog(lt, a, a + d));
  const out = 1 - easeInCubic(prog(t, TOTAL - .5, TOTAL));
  ctx.save();
  ctx.globalAlpha = out;

  // kartu
  const cw = 1440, ch = 640, cx = (W - cw) / 2, cy = (H - ch) / 2 - 10;
  const ck = inK(.15, .6);
  ctx.save();
  ctx.globalAlpha = out * ck;
  ctx.translate(0, (1 - ck) * 40);
  ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 60; ctx.shadowOffsetY = 20;
  ctx.fillStyle = 'rgba(8,46,34,.92)';
  roundRect(cx, cy, cw, ch, 36); ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.strokeStyle = 'rgba(182,242,58,.25)'; ctx.lineWidth = 2;
  roundRect(cx, cy, cw, ch, 36); ctx.stroke();
  // aksen kiri
  const ag = ctx.createLinearGradient(0, cy, 0, cy + ch);
  ag.addColorStop(0, C.lime); ag.addColorStop(1, C.teal);
  ctx.fillStyle = ag;
  roundRect(cx, cy + 40, 10, ch - 80, 5); ctx.fill();
  ctx.restore();

  const padX = cx + 110;

  // ikon peringatan + judul
  const hk = inK(.45, .5);
  ctx.save();
  ctx.globalAlpha = out * hk;
  ctx.translate((1 - hk) * -30, 0);
  const ix = padX + 34, iy = cy + 120;
  const pulse = 1 + .06 * Math.sin(lt * 5) * prog(lt, .9, 1.2);
  ctx.save(); ctx.translate(ix, iy); ctx.scale(pulse, pulse);
  ctx.fillStyle = C.amber;
  ctx.beginPath();
  ctx.moveTo(0, -38); ctx.lineTo(40, 32); ctx.lineTo(-40, 32); ctx.closePath();
  ctx.lineJoin = 'round'; ctx.lineWidth = 10; ctx.strokeStyle = C.amber; ctx.stroke(); ctx.fill();
  ctx.fillStyle = '#3A2A00';
  ctx.fillRect(-4, -14, 8, 26);
  ctx.beginPath(); ctx.arc(0, 22, 5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.font = `800 76px ${FONT}`;
  ctx.fillStyle = C.amber; ctx.textBaseline = 'middle';
  ctx.fillText('Perhatian', padX + 100, iy + 4);
  ctx.restore();

  // isi
  const body = 'Informasi yang kami sajikan adalah berdasarkan data. ' +
    'Untuk menghindari ketidak akuratan informasi, mohon dipastikan terlebih dahulu ' +
    'agar data sesuai dan tervalidasi.';
  ctx.save();
  ctx.font = `500 46px ${FONT}`;
  ctx.textBaseline = 'alphabetic';
  const lines = wrapLines(body, cw - 220);
  lines.forEach((ln, i) => {
    const k = inK(.75 + i * .14, .55);
    ctx.globalAlpha = out * k;
    ctx.fillStyle = C.cream;
    ctx.fillText(ln, padX, cy + 260 + i * 68 + (1 - k) * 20);
  });
  ctx.restore();

  // terima kasih
  const tk = inK(1.6, .6);
  ctx.save();
  ctx.globalAlpha = out * tk;
  ctx.font = `700 52px ${FONT}`;
  ctx.fillStyle = C.lime;
  ctx.fillText('Terima Kasih', padX, cy + 260 + lines.length * 68 + 60 + (1 - tk) * 20);
  ctx.restore();

  // logo kecil + nama di pojok kanan bawah kartu
  const lk = inK(1.9, .6);
  ctx.save();
  ctx.globalAlpha = out * lk;
  drawLogo(cx + cw - 400, cy + ch - 78, .22, { ring: 1, bars: [1, 1, 1], stem: 1, leaves: [1, 1], glow: 0 });
  ctx.font = `800 40px ${FONT}`;
  ctx.textBaseline = 'middle';
  ctx.fillStyle = C.cream; ctx.fillText('Let', cx + cw - 350, cy + ch - 76);
  let w = ctx.measureText('Let').width;
  ctx.fillStyle = C.lime; ctx.fillText('.growww', cx + cw - 350 + w, cy + ch - 76);
  ctx.restore();

  // progress bar waktu baca
  const pk = prog(t, INTRO + .6, TOTAL - .4);
  ctx.save();
  ctx.globalAlpha = out * .9;
  ctx.fillStyle = 'rgba(255,255,255,.08)';
  roundRect(cx + 110, cy + ch + 40, cw - 220, 6, 3); ctx.fill();
  ctx.fillStyle = C.mint;
  roundRect(cx + 110, cy + ch + 40, (cw - 220) * pk, 6, 3); ctx.fill();
  ctx.restore();

  ctx.restore();

  // lingkaran lime terbuka (lanjutan transisi dari intro)
  const w2 = easeOutCubic(prog(t, 4.85, 5.35));
  if (w2 < 1) {
    ctx.save();
    ctx.fillStyle = C.lime;
    ctx.beginPath();
    ctx.rect(0, 0, W, H);
    ctx.arc(W / 2, 345, w2 * 1350, 0, Math.PI * 2, true);
    ctx.fill('evenodd');
    ctx.restore();
  }

  // fade ke hitam di akhir
  ctx.fillStyle = `rgba(0,0,0,${1 - out})`;
  ctx.fillRect(0, 0, W, H);
}

function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.clearRect(0, 0, W, H);
  if (t < 4.85) intro(t); else disclaimer(t);
}
window.render = render;
window.TOTAL = TOTAL;

// preview langsung di browser: buka scene.html?preview
if (location.search.includes('preview')) {
  let start = null;
  const loop = ts => {
    if (start === null) start = ts;
    const t = ((ts - start) / 1000) % TOTAL;
    render(t);
    requestAnimationFrame(loop);
  };
  document.fonts.ready.then(() => requestAnimationFrame(loop));
}
</script>
</body>
</html>
