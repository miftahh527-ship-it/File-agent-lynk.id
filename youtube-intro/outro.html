<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Let.growww Outro</title>
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; width: 100vw; height: auto; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// =============================================================
//  Let.growww — YouTube outro (10 dtk)
//  render(t) menggambar satu frame pada waktu t (detik).
//  Dipakai oleh render.js (Playwright) untuk ekspor frame-by-frame,
//  dan bisa juga dibuka langsung di browser untuk preview (?preview).
// =============================================================
const W = 1920, H = 1080;
const TOTAL = 10.0;         // durasi outro
const FONT = '"Inter", "Inter Display", "DejaVu Sans", sans-serif';

const C = {
  bg1: '#06261C', bg2: '#0B4A35', bg3: '#021510',
  lime: '#B6F23A', mint: '#4ADE9B', teal: '#1FB58F',
  cream: '#F4FBEF', amber: '#FFC94A', muted: '#A9CBB9',
};

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const easeOutCubic = k => 1 - Math.pow(1 - k, 3);
const easeInOutCubic = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeInCubic = k => k * k * k;
const easeOutBack = (k, s = 1.9) => 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2);
const easeOutElastic = k => k === 0 ? 0 : k === 1 ? 1 :
  Math.pow(2, -10 * k) * Math.sin((k * 10 - 0.75) * (2 * Math.PI) / 3) + 1;

function rng(seed) { // mulberry32 — deterministik
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const R = rng(20261102);
const PARTICLES = Array.from({ length: 70 }, () => ({
  x: R() * W, y: R() * H, r: 1.5 + R() * 4, sp: 18 + R() * 55,
  ph: R() * Math.PI * 2, a: .15 + R() * .35, hue: R() < .5 ? C.lime : C.mint,
}));
const SPARKS = Array.from({ length: 22 }, (_, i) => ({
  ang: (i / 22) * Math.PI * 2 + R() * .3, dist: 120 + R() * 140, r: 2 + R() * 4, col: i % 2 ? C.lime : C.mint,
}));

function roundRect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ---------- background ----------
function background(t, glowK = 1) {
  const g = ctx.createRadialGradient(W / 2, H * .45, 50, W / 2, H / 2, W * .75);
  g.addColorStop(0, C.bg2); g.addColorStop(.55, C.bg1); g.addColorStop(1, C.bg3);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // grid halus (nuansa "data")
  ctx.save();
  ctx.globalAlpha = .06 * glowK;
  ctx.strokeStyle = C.mint; ctx.lineWidth = 1;
  const off = (t * 20) % 80;
  for (let x = -80 + off; x < W + 80; x += 80) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = -80 + off; y < H + 80; y += 80) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.restore();

  // partikel naik (tumbuh)
  ctx.save();
  for (const p of PARTICLES) {
    const y = ((p.y - t * p.sp) % H + H) % H;
    const x = p.x + Math.sin(t * 1.3 + p.ph) * 14;
    ctx.globalAlpha = p.a * glowK * (0.6 + 0.4 * Math.sin(t * 3 + p.ph));
    ctx.fillStyle = p.hue;
    ctx.beginPath(); ctx.arc(x, y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();

  // vignette
  const v = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, W * .7);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.55)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

// ---------- logo: maskot Let.growww di dalam lencana bulat ----------
const LOGO = new Image();
LOGO.src = 'assets/logo-badge.png';
window.setLogo = src => new Promise(res => { LOGO.onload = res; LOGO.src = src; });

function star(x, y, r, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const rr = i % 2 ? r * .28 : r;
    const a = i * Math.PI / 4;
    ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

// opts: ring (gambar lingkaran), reveal (maskot muncul), stars[3], bounce, glow  (0..1)
const STAR_POS = [[-205, -95, C.mint], [30, -225, C.lime], [210, -30, C.amber]];
function drawLogo(cx, cy, s, o, t = 0) {
  ctx.save();
  ctx.translate(cx, cy); ctx.scale(s, s);

  // glow
  if (o.glow > 0) {
    const gg = ctx.createRadialGradient(0, 0, 40, 0, 0, 320);
    gg.addColorStop(0, `rgba(182,242,58,${.35 * o.glow})`);
    gg.addColorStop(1, 'rgba(182,242,58,0)');
    ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(0, 0, 320, 0, Math.PI * 2); ctx.fill();
  }

  // dasar lencana
  if (o.ring > 0) {
    ctx.globalAlpha = clamp(o.ring * 1.5);
    ctx.fillStyle = '#0B3D2C';
    ctx.beginPath(); ctx.arc(0, 0, 160, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // maskot (iris reveal + lompat)
  if (o.reveal > 0 && LOGO.complete && LOGO.naturalWidth) {
    ctx.save();
    ctx.beginPath(); ctx.arc(0, 0, 152 * o.reveal, 0, Math.PI * 2); ctx.clip();
    const z = lerp(1.35, 1, easeOutCubic(o.reveal));
    const b = Math.sin(clamp(o.bounce) * Math.PI);
    ctx.translate(0, -b * 14);
    ctx.scale(z * (1 + b * .04), z * (1 - b * .03));
    ctx.drawImage(LOGO, -158, -150, 316, 316);
    ctx.restore();
    // vinyet dalam supaya tepi lencana lembut
    const iv = ctx.createRadialGradient(0, 0, 105, 0, 0, 154);
    iv.addColorStop(0, 'rgba(6,38,28,0)'); iv.addColorStop(1, 'rgba(6,38,28,.55)');
    ctx.fillStyle = iv; ctx.beginPath(); ctx.arc(0, 0, 154 * o.reveal, 0, Math.PI * 2); ctx.fill();
  }

  // ring
  if (o.ring > 0) {
    const rg = ctx.createLinearGradient(-160, 160, 160, -160);
    rg.addColorStop(0, C.teal); rg.addColorStop(.5, C.mint); rg.addColorStop(1, C.lime);
    ctx.strokeStyle = rg; ctx.lineWidth = 12; ctx.lineCap = 'round';
    ctx.beginPath();
    const st = Math.PI / 2;
    ctx.arc(0, 0, 160, st, st + Math.PI * 2 * o.ring);
    ctx.stroke();
  }

  // 3 bintang kilau (sinkron dengan "ting-ting-ting")
  if (o.stars) o.stars.forEach((k, i) => {
    if (k <= 0) return;
    const [x, y, col] = STAR_POS[i];
    const tw = 1 + .15 * Math.sin(t * 6 + i * 2);
    ctx.fillStyle = col;
    ctx.shadowColor = col; ctx.shadowBlur = 20;
    star(x, y, 26 * k * tw, k * .8 + t * .6);
    ctx.shadowBlur = 0;
  });

  ctx.restore();
}

// ---------- ikon platform ----------
function iconYouTube(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = '#FF0033';
  roundRect(-45, -32, 90, 64, 18); ctx.fill();
  ctx.fillStyle = '#FFFFFF';
  ctx.beginPath(); ctx.moveTo(-12, -17); ctx.lineTo(20, 0); ctx.lineTo(-12, 17); ctx.closePath();
  ctx.lineJoin = 'round'; ctx.lineWidth = 4; ctx.strokeStyle = '#FFFFFF'; ctx.stroke(); ctx.fill();
  ctx.restore();
}
function iconInstagram(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  const g = ctx.createLinearGradient(-45, 45, 45, -45);
  g.addColorStop(0, '#FEDA75'); g.addColorStop(.3, '#FA7E1E'); g.addColorStop(.55, '#D62976');
  g.addColorStop(.8, '#962FBF'); g.addColorStop(1, '#4F5BD5');
  ctx.fillStyle = g;
  roundRect(-45, -45, 90, 90, 26); ctx.fill();
  ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 7;
  roundRect(-28, -28, 56, 56, 17); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, 13, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = '#FFFFFF';
  ctx.beginPath(); ctx.arc(18, -18, 4.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function heart(x, y, r) {
  ctx.beginPath();
  ctx.moveTo(x, y + r * .9);
  ctx.bezierCurveTo(x - r * 1.6, y - r * .2, x - r * .7, y - r * 1.3, x, y - r * .45);
  ctx.bezierCurveTo(x + r * .7, y - r * 1.3, x + r * 1.6, y - r * .2, x, y + r * .9);
  ctx.fill();
}
function cursor(x, y, press) {
  ctx.save(); ctx.translate(x, y); ctx.scale(1.5 * (1 - press * .12), 1.5 * (1 - press * .12));
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(0, 34); ctx.lineTo(9, 26); ctx.lineTo(15, 40);
  ctx.lineTo(21, 37); ctx.lineTo(15, 24); ctx.lineTo(27, 24); ctx.closePath();
  ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 4;
  ctx.fillStyle = '#FFFFFF'; ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.lineWidth = 2.5; ctx.strokeStyle = '#06261C'; ctx.lineJoin = 'round'; ctx.stroke();
  ctx.restore();
}

// ---------- kartu sosial ----------
const CARD_W = 770, CARD_H = 150, CARD_Y = 790;
const CARDS = [
  { x: W / 2 - 20 - CARD_W, icon: iconYouTube, label: 'YouTube', user: '@Let.growww',
    btn: ['SUBSCRIBE', '✓ SUBSCRIBED'], btnCol: '#FF0033', t0: 3.6, click: 5.2 },
  { x: W / 2 + 20, icon: iconInstagram, label: 'Instagram', user: '@let.growww',
    btn: ['Follow', '✓ Following'], btnCol: '#4F5BD5', t0: 3.8, click: 6.6 },
];
const BTN_W = 210, BTN_H = 66;
const btnCenter = c => [c.x + CARD_W - 36 - BTN_W / 2, CARD_Y + CARD_H / 2];

function drawCard(c, t) {
  const k = easeOutBack(prog(t, c.t0, c.t0 + .55), 2.0);
  if (k <= 0) return;
  const cx = c.x + CARD_W / 2, cy = CARD_Y + CARD_H / 2;
  const clickK = prog(t, c.click - .06, c.click + .14);
  const press = Math.sin(clickK * Math.PI) * .05;
  ctx.save();
  ctx.globalAlpha = clamp(k);
  ctx.translate(cx, cy + (1 - clamp(k)) * 60); ctx.scale(k * (1 - press * .4), k * (1 - press * .4)); ctx.translate(-cx, -cy);
  ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 14;
  ctx.fillStyle = 'rgba(8,46,34,.94)';
  roundRect(c.x, CARD_Y, CARD_W, CARD_H, 32); ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.strokeStyle = 'rgba(182,242,58,.28)'; ctx.lineWidth = 2;
  roundRect(c.x, CARD_Y, CARD_W, CARD_H, 32); ctx.stroke();

  // ikon (bergoyang saat diklik)
  const wig = Math.sin(prog(t, c.click, c.click + .6) * Math.PI * 4) * (1 - prog(t, c.click, c.click + .6)) * .18;
  ctx.save(); ctx.translate(c.x + 90, cy); ctx.rotate(wig);
  c.icon(0, 0, 1.05);
  ctx.restore();

  ctx.textBaseline = 'middle';
  ctx.fillStyle = C.muted; ctx.font = `600 26px ${FONT}`;
  ctx.fillText(c.label, c.x + 160, cy - 26);
  ctx.fillStyle = C.cream; ctx.font = `800 40px ${FONT}`;
  ctx.fillText(c.user, c.x + 160, cy + 18);

  // tombol
  const done = t >= c.click;
  const [bx, by] = btnCenter(c);
  const bs = 1 - Math.sin(clickK * Math.PI) * .1;
  ctx.save(); ctx.translate(bx, by); ctx.scale(bs, bs);
  ctx.fillStyle = done ? 'rgba(255,255,255,.14)' : c.btnCol;
  roundRect(-BTN_W / 2, -BTN_H / 2, BTN_W, BTN_H, 33); ctx.fill();
  ctx.fillStyle = '#FFFFFF'; ctx.textAlign = 'center';
  ctx.font = `800 ${done ? 24 : 26}px ${FONT}`;
  ctx.fillText(done ? c.btn[1] : c.btn[0], 0, 1);
  ctx.restore();
  ctx.restore();

  // riak klik
  const rk = prog(t, c.click, c.click + .5);
  if (rk > 0 && rk < 1) {
    ctx.save();
    ctx.globalAlpha = (1 - rk) * .8;
    ctx.strokeStyle = C.lime; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(bx, by, 30 + rk * 90, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
}

// hati melayang setelah follow / like
const HEARTS = Array.from({ length: 10 }, () => ({ dx: (R() - .5) * 160, sp: 50 + R() * 70, r: 10 + R() * 10, d: R() * .5, sw: R() * 6 }));
function drawHearts(t, x, y, t0, col) {
  for (const h of HEARTS) {
    const k = prog(t, t0 + h.d, t0 + h.d + 1.4);
    if (k <= 0 || k >= 1) continue;
    ctx.save();
    ctx.globalAlpha = Math.sin(k * Math.PI) * .95;
    ctx.fillStyle = col;
    heart(x + h.dx * k + Math.sin(k * 8 + h.sw) * 10, y - k * h.sp, h.r * (0.6 + k * .5));
    ctx.restore();
  }
}

// ---------- teks ----------
function wordmark(t, cx, cy) {
  const parts = [['Let', C.cream], ['.', C.lime], ['gro', C.lime], ['w', C.lime], ['w', C.mint], ['w', C.teal]];
  ctx.save();
  ctx.font = `800 64px ${FONT}`; ctx.textBaseline = 'middle';
  const ws = parts.map(p => ctx.measureText(p[0]).width);
  let x = cx - ws.reduce((a, b) => a + b, 0) / 2;
  const k = easeOutCubic(prog(t, 1.85, 2.3));
  parts.forEach((p, i) => {
    let dy = (1 - k) * 30;
    if (i >= 3) { const bk = prog(t, 2.1 + (i - 3) * .12, 2.42 + (i - 3) * .12); if (bk > 0 && bk < 1) dy -= Math.sin(bk * Math.PI) * 18; }
    ctx.globalAlpha = k; ctx.fillStyle = p[1];
    ctx.fillText(p[0], x, cy + dy);
    x += ws[i];
  });
  ctx.restore();
}

function wordsRise(text, t, t0, cx, cy, font, col, step = .07) {
  ctx.save();
  ctx.font = font; ctx.textBaseline = 'alphabetic';
  const words = text.split(' ');
  const sp = ctx.measureText(' ').width;
  const ws = words.map(w => ctx.measureText(w).width);
  let x = cx - (ws.reduce((a, b) => a + b, 0) + sp * (words.length - 1)) / 2;
  words.forEach((w, i) => {
    const k = easeOutCubic(prog(t, t0 + i * step, t0 + i * step + .45));
    ctx.globalAlpha = k; ctx.fillStyle = col;
    ctx.fillText(w, x, cy + (1 - k) * 28);
    x += ws[i] + sp;
  });
  ctx.restore();
}

// ---------- OUTRO (0–10 dtk) ----------
function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.clearRect(0, 0, W, H);
  background(t, clamp(t / .6));

  const fl = Math.sin(t * 1.6) * 5 * prog(t, 2, 3);  // logo melayang pelan
  const pop = easeOutBack(prog(t, .05, .55), 1.6);
  const s = .72 * (.6 + .4 * pop) * (1 + .06 * Math.sin(prog(t, 1.55, 1.85) * Math.PI));
  drawLogo(W / 2, 235 + fl, s, {
    ring: easeInOutCubic(prog(t, .1, .75)),
    reveal: easeOutCubic(prog(t, .3, .9)),
    stars: [0, 1, 2].map(i => easeOutBack(prog(t, .62 + i * .25, 1.0 + i * .25), 2.4)),
    bounce: prog(t, 1.5, 1.9),
    glow: prog(t, 1.5, 1.9) * (0.7 + .3 * Math.sin(t * 4)),
  }, t);
  drawSparks(t, W / 2, 235, s, 1.58);

  wordmark(t, W / 2, 420);
  wordsRise('Terima Kasih sudah menonton video kami.', t, 2.4, W / 2, 560, `800 68px ${FONT}`, C.cream);
  wordsRise('Jangan lupa Subscribe, like, komen dan follow platform sosial kami ya :)', t, 3.0, W / 2, 640,
    `500 40px ${FONT}`, C.muted, .035);
  // sorot kata-kata ajakan dengan garis bawah lime
  const ul = easeInOutCubic(prog(t, 3.4, 3.9));
  if (ul > 0) {
    ctx.save();
    const lg = ctx.createLinearGradient(W / 2 - 300, 0, W / 2 + 300, 0);
    lg.addColorStop(0, C.teal); lg.addColorStop(1, C.lime);
    ctx.fillStyle = lg;
    roundRect(W / 2 - 300 * ul, 672, 600 * ul, 6, 3); ctx.fill();
    ctx.restore();
  }

  CARDS.forEach(c => drawCard(c, t));
  drawHearts(t, btnCenter(CARDS[1])[0], CARD_Y, 6.65, '#F0457A');
  drawHearts(t, btnCenter(CARDS[0])[0], CARD_Y, 5.25, '#FF4D6A');

  // kursor: masuk -> klik SUBSCRIBE -> klik Follow -> keluar
  const [ax, ay] = btnCenter(CARDS[0]), [bx, by] = btnCenter(CARDS[1]);
  const path = [
    [4.3, W + 80, H + 80], [5.1, ax, ay], [5.6, ax, ay], [6.5, bx, by], [6.95, bx, by], [7.7, W + 120, H + 60],
  ];
  if (t >= path[0][0] && t <= path[path.length - 1][0]) {
    let px = path[0][1], py = path[0][2];
    for (let i = 0; i < path.length - 1; i++) {
      const [t0, x0, y0] = path[i], [t1, x1, y1] = path[i + 1];
      if (t >= t0 && t <= t1) {
        const k = easeInOutCubic(prog(t, t0, t1));
        px = lerp(x0, x1, k); py = lerp(y0, y1, k) - Math.sin(k * Math.PI) * 40;
      }
    }
    const press = Math.max(Math.sin(prog(t, 5.12, 5.32) * Math.PI), Math.sin(prog(t, 6.52, 6.72) * Math.PI));
    cursor(px + 10, py + 6, press);
  }

  // akhir: fade ke hitam
  const out = easeInCubic(prog(t, TOTAL - .8, TOTAL));
  if (out > 0) { ctx.fillStyle = `rgba(0,0,0,${out})`; ctx.fillRect(0, 0, W, H); }
}

function drawSparks(t, cx, cy, s, t0) {
  const k = prog(t, t0, t0 + .7);
  if (k <= 0 || k >= 1) return;
  ctx.save();
  for (const p of SPARKS) {
    const d = easeOutCubic(k) * p.dist * s;
    ctx.globalAlpha = (1 - k) * .9;
    ctx.fillStyle = p.col;
    ctx.beginPath();
    ctx.arc(cx + Math.cos(p.ang) * d, cy + Math.sin(p.ang) * d, p.r * (1 - k * .5), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

window.render = render;
window.TOTAL = TOTAL;

if (location.search.includes('preview')) {
  let start = null;
  const loop = ts => {
    if (start === null) start = ts;
    render(((ts - start) / 1000) % TOTAL);
    requestAnimationFrame(loop);
  };
  document.fonts.ready.then(() => requestAnimationFrame(loop));
}
</script>
</body>
</html>
