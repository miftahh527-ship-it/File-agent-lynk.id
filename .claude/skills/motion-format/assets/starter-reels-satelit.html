<!--
  REELS SATELIT: explainer edukasi tegak bergaya pandangan udara/satelit (geografi, tempat, sejarah wilayah).
  Panduan: references/reels-dokumenter.md → "Gaya satelit & teknik modern". Semua grafis DIBUAT SENDIRI:
    - garis pantai dari scripts/peta_data.py (peta_svg.py --tanpa-gaya, ukuran 4320×7680), disimpan di #sumber;
    - medan bergaya satelit = ubin relief yang dihitung di halaman (noise berperiode + bayangan bukit), 4 tingkat
      kerincian yang bergantian mengikuti zoom → tetap tajam dari 1× sampai ±300×;
    - KAMERA = viewBox SVG (bukan transform), jadi vektor selalu digambar ulang tajam.
  Komponen: garisTepi (tepi menyala), labelTitik (label + garis ke titik, ikut kamera), caption karaoke yang bisa
  diletakkan di mana saja + warna bermakna (air/darat/bahaya), lensa (lingkaran "dulu"), gradasi (warna era),
  angkaTengah, awanLewat, silang, morf, tembus, label tempat (#tempat).
  Ganti: #sumber (peta wilayahmu), PETA (dari .json), NASKAH, KOREOGRAFI, AUDIO_PLAN. autoplay+loop; ?debug=1; ?clean=1.
-->

  <svg id="peta" data-tata="latar" viewBox="0 0 4320 7680"></svg>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const $=s=>document.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const W=1080,H=1920,DUR=25,NS='http://www.w3.org/2000/svg';
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);$('#stage').style.transform=`translate(-50%,-50%) scale(${s})`;}
addEventListener('resize',fit);fit();
const tl=gsap.timeline({paused:true});
const rnd=(a,b)=>{const x=Math.sin(a*12.9898+b*78.233)*43758.5453;return x-Math.floor(x);};
const el=(tag,a={},p)=>{const n=document.createElementNS(NS,tag);for(const k in a)n.setAttribute(k,a[k]);if(p)p.appendChild(n);return n;};

/* ================= PETA: parameter proyeksi dari <nama>.json (peta_svg.py) → titikPeta(bujur, lintang) ================= */
const PETA={"ukuran":[4320,7680],"proyeksi":"mercator","pusat":[100.65,0.0],"skala":21418.982995544702,"tengah":[0.0,-0.003069911734772883],"bentuk":[{"id":"pulau-sumatra","nama":"Sumatra","x":2564.7,"y":4001.1,"kotak":[[160.0,1677.4],[4160.0,6002.6]]},{"id":"danau-toba","nama":"Danau Toba","x":1473.5,"y":2800.5,"kotak":[[1348.8,2682.2],[1588.0,2917.9]]},{"id":"pulau-samosir","nama":"Samosir","x":1465.6,"y":2803.6,"kotak":[[1410.5,2742.1],[1524.5,2865.6]]},{"id":"danau-sidihoni","nama":"Danau Sidihoni","x":1448.0,"y":2807.7,"kotak":[[1445.2,2804.9],[1450.8,2810.2]]}]};
function titikPeta(lon,lat){const R=Math.PI/180,x=(((lon-PETA.pusat[0]+540)%360)-180)*R,y=Math.log(Math.tan(Math.PI/4+Math.max(-85,Math.min(85,lat))*R/2));
  return [PETA.ukuran[0]/2+(x-PETA.tengah[0])*PETA.skala,PETA.ukuran[1]/2-(y-PETA.tengah[1])*PETA.skala];}   // (proyeksi mercator)
const SW=PETA.ukuran[0],SH=PETA.ukuran[1];

/* ================= UBIN MEDAN: relief bergaya satelit, dihitung sendiri (noise berperiode + bayangan bukit) ================= */
function ubin(n,{rendah,tinggi,bayang=1,seed=1,air=false}){
  const cv=document.createElement('canvas');cv.width=cv.height=n;const cx=cv.getContext('2d'),img=cx.createImageData(n,n),h=new Float32Array(n*n);
  const okt=[[3,.42],[6,.26],[12,.16],[24,.1],[48,.06]];
  for(const [L,amp] of okt){const g=[...Array(L*L)].map((_,i)=>rnd(seed*31+L,i));
    for(let y=0;y<n;y++)for(let x=0;x<n;x++){const fx=x*L/n,fy=y*L/n,x0=Math.floor(fx),y0=Math.floor(fy),tx=fx-x0,ty=fy-y0,
      sx=tx*tx*(3-2*tx),sy=ty*ty*(3-2*ty),G=(i,j)=>g[((j%L)*L)+(i%L)],
      v=(G(x0,y0)*(1-sx)+G(x0+1,y0)*sx)*(1-sy)+(G(x0,y0+1)*(1-sx)+G(x0+1,y0+1)*sx)*sy;
      h[y*n+x]+=amp*(air?v:1-Math.abs(2*v-1));}}                 // darat: punggung bukit (ridged); air: riak lembut
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){const i=y*n+x,H_=h[i],dx=h[y*n+(x+1)%n]-h[y*n+(x+n-1)%n],dy=h[((y+1)%n)*n+x]-h[((y+n-1)%n)*n+x];
    const s=Math.max(.6,Math.min(1.25,1+(-dx-dy)*3.2*bayang)),t=Math.min(1,Math.max(0,H_*1.15-.1));
    for(let c=0;c<3;c++)img.data[i*4+c]=Math.min(255,(rendah[c]+(tinggi[c]-rendah[c])*t)*s);img.data[i*4+3]=255;}
  cx.putImageData(img,0,0);return cv.toDataURL('image/jpeg',.9);}
const UB_DARAT=ubin(512,{rendah:[40,82,44],tinggi:[120,148,88],seed:3}),UB_AIR=ubin(256,{rendah:[20,74,116],tinggi:[38,112,152],bayang:.3,seed:7,air:true});
/* ubin MAKRO: bercak warna besar (hutan gelap, ladang terang, tanah kecokelatan) dikalikan di atas relief → pola tidak tampak berulang */
const UB_MAKRO=ubin(256,{rendah:[150,170,120],tinggi:[255,250,225],bayang:0,seed:11,air:true});

/* ================= BANGUN PETA: tingkat kerincian Z (ubin makin kecil per tingkat), lapis air/darat bersarang ================= */
const svg=$('#peta'),defs=el('defs',{},svg),Z=[1,5,25,125];
function pola(id,href,size,rot=0){const p=el('pattern',{id,patternUnits:'userSpaceOnUse',width:size,height:size,patternTransform:`rotate(${rot})`},defs);   /* diputar: grid noise tak sejajar sumbu */el('image',{href,width:size,height:size,preserveAspectRatio:'none'},p);}
Z.forEach((z,i)=>{pola('darat'+i,UB_DARAT,2600/z,31+i*17);pola('airp'+i,UB_AIR,2400/z,-12+i*9);pola('makro'+i,UB_MAKRO,9700/z,-23+i*11);});
const ambil=id=>$('#sumber #'+id).getAttribute('d');
const D={sumatra:ambil('pulau-sumatra'),toba:ambil('danau-toba'),samosir:ambil('pulau-samosir'),sidihoni:ambil('danau-sidihoni')};
const TINGKAT=[];       // [{g, z}] → opacity mengikuti zoom
function lapisPola(d,jenis,induk){Z.forEach((z,i)=>{const p=el('path',{d,fill:`url(#${jenis}${i})`},induk);TINGKAT.push({n:p,z});
  if(jenis==='darat'){const m=el('path',{d,fill:`url(#makro${i})`,style:'mix-blend-mode:multiply'},induk);TINGKAT.push({n:m,z});}});}
el('rect',{x:-SW*4,y:-SH*4,width:SW*9,height:SH*9,fill:'#164a6e'},svg);
const gLaut=el('g',{},svg);lapisPola(`M${-SW*4} ${-SH*4}h${SW*9}v${SH*9}h${-SW*9}Z`,'airp',gLaut);
el('path',{d:D.sumatra,fill:'none',stroke:'#5fd0d8','stroke-width':34,opacity:.35,'vector-effect':'non-scaling-stroke',style:'filter:blur(8px)'},svg);  // laut dangkal
const gDarat=el('g',{},svg);lapisPola(D.sumatra,'darat',gDarat);
const gToba=el('g',{},svg);lapisPola(D.toba,'airp',gToba);
const gSamosir=el('g',{},svg);lapisPola(D.samosir,'darat',gSamosir);
const gSidi=el('g',{},svg);lapisPola(D.sidihoni,'airp',gSidi);
/* lapisan "DULU": tanah sempit yang menyambung Samosir ke tepi barat (dari bujur/lintang) + kanal yang memotongnya */
function poli(pts,iter=3){let q=pts.map(([lo,la])=>titikPeta(lo,la));          // bujur/lintang → path halus (Chaikin)
  for(let k=0;k<iter;k++){const r=[];q.forEach((a,i)=>{const b=q[(i+1)%q.length];r.push([a[0]*.75+b[0]*.25,a[1]*.75+b[1]*.25],[a[0]*.25+b[0]*.75,a[1]*.25+b[1]*.75]);});q=r;}
  return 'M'+q.map(v=>v.map(n=>n.toFixed(2)).join(' ')).join('L')+'Z';}
const gDulu=el('g',{opacity:0},svg);lapisPola(poli([[98.622,2.642],[98.640,2.646],[98.658,2.638],[98.660,2.603],[98.643,2.593],[98.625,2.597]]),'darat',gDulu);
const [k1,k2]=[titikPeta(98.6405,2.637),titikPeta(98.6405,2.597)];
const kanal=el('path',{d:`M${k1[0]} ${k1[1]}L${k2[0]} ${k2[1]}`,fill:'none',stroke:'#2f87b5','stroke-width':2.2,'stroke-linecap':'round'},svg);
const gTepi=el('g',{fill:'none','stroke-linejoin':'round'},svg);   // garis tepi menyala (digambar di atas semua)

/* ================= KAMERA = viewBox: (x,y) titik fokus dalam koordinat peta, z = zoom (1 = seluruh peta) ================= */
const C={x:SW/2,y:SH/2,z:1};
function vb(){const w=SW/C.z,h=SH/C.z;return [C.x-w/2,C.y-h/2,w,h];}
function applyCam(){const [x,y,w,h]=vb();svg.setAttribute('viewBox',`${x} ${y} ${w} ${h}`);
  for(const t of TINGKAT)t.n.setAttribute('opacity',t.z===1?1:Math.max(0,Math.min(1,(Math.log(C.z/t.z)+.7)/.7)));   // tingkat halus muncul saat zoom mendekat
  for(const g of TEPI)g.n.setAttribute('stroke-width',g.w*w/W);                                                         // tebal garis tetap di layar
  kanal.setAttribute('stroke-width',Math.max(2.2*w/W,2.2));drawLabels();}
const toScreen=(x,y)=>{const [vx,vy,w,h]=vb();return [(x-vx)/w*W,(y-vy)/h*H];};
const cam=(at,x,y,z,dur=2,ease='power2.inOut')=>tl.to(C,{x,y,z,duration:dur,ease,onUpdate:applyCam},at);
/* zoom jauh terasa wajar bila zoom berjalan pada skala log: tween eksponen, bukan z langsung */
function zoom(at,x,y,z,dur=2.2,ease='power2.inOut'){const o={x:C._x??C.x,y:C._y??C.y,l:Math.log(C._z??C.z)};C._x=x;C._y=y;C._z=z;
  const p={x:o.x,y:o.y,l:o.l};tl.fromTo(p,{x:o.x,y:o.y,l:o.l},{x,y,l:Math.log(z),duration:dur,ease,immediateRender:false,onUpdate(){C.x=p.x;C.y=p.y;C.z=Math.exp(p.l);applyCam();}},at);}

/* ================= GARIS TEPI menyala: menyusuri bentuk (warna = makna: air/darat/bahaya) ================= */
const TEPI=[];
function garisTepi(d,at,{warna='darat',w=4,dur=1.4,sampai=null}={}){const c=getComputedStyle(document.body).getPropertyValue('--'+warna).trim()||warna;
  const n=el('path',{d,stroke:c,'stroke-width':w,opacity:0,style:`filter:drop-shadow(0 0 6px ${c})`},gTepi);const L=n.getTotalLength();
  n.style.strokeDasharray=L;TEPI.push({n,w});tl.set(n,{opacity:1},at);
  tl.fromTo(n,{strokeDashoffset:L},{strokeDashoffset:0,duration:dur,ease:'power1.inOut',immediateRender:false},at);
  if(sampai)tl.to(n,{opacity:0,duration:.4},sampai);return n;}

/* ================= LABEL TITIK: teks (boleh berwarna) + garis tegak ke titik peta; ikut kamera ================= */
const LBL=[];const lsvg=$('#lapisLabel svg');
function labelTitik(at,{x,y,teks,panjang=260,sampai,arah=-1}){const d=document.createElement('div');d.className='lt';d.innerHTML=teks;$('#lapisLabel').appendChild(d);
  const ln=el('line',{class:'lt-garis'},lsvg),dot=el('circle',{class:'lt-titik',r:0},lsvg),L={x,y,d,ln,dot,panjang,arah,p:{v:0}};LBL.push(L);
  tl.fromTo(L.p,{v:0},{v:1,duration:.5,ease:'power2.out',immediateRender:false,onUpdate:drawLabels},at);
  tl.fromTo(d,{opacity:0},{opacity:1,duration:.35,immediateRender:false},at+.15);
  if(sampai){tl.to(d,{opacity:0,duration:.3},sampai);tl.to(L.p,{v:0,duration:.3,onUpdate:drawLabels},sampai);}return L;}
function drawLabels(){for(const L of LBL){const [sx,sy]=toScreen(L.x,L.y),ty=sy+L.arah*L.panjang*L.p.v,cx=Math.max(230,Math.min(W-230,sx));
  L.ln.setAttribute('x1',sx);L.ln.setAttribute('y1',sy);L.ln.setAttribute('x2',sx);L.ln.setAttribute('y2',ty);L.ln.setAttribute('opacity',L.p.v>0?.9:0);
  L.dot.setAttribute('cx',sx);L.dot.setAttribute('cy',sy);L.dot.setAttribute('r',6*Math.min(1,L.p.v*2));
  L.d.style.left=cx+'px';L.d.style.top=(L.arah<0?ty-L.d.offsetHeight-8:ty+8)+'px';}}

/* ================= CAPTION KARAOKE di posisi bebas + warna bermakna =================
   kunci: {kata:'air'|'darat'|'bahaya'}; pos: {x,y,rata:'kiri'|'tengah'} (layar). Default di bawah tengah. */
const NASKAH=[
  {at:.3, sampai:2.2, teks:'Ini Pulau Sumatra', kunci:{'Sumatra':'darat'}, pos:{x:540,y:330}},
  {at:3.0,sampai:5.2, teks:'di dalamnya ada Danau Toba,', kunci:{'Danau':'air','Toba,':'air'}, pos:{x:540,y:330}},
  {at:5.8,sampai:8.2, teks:'di dalam danau ada pulau, Samosir', kunci:{'Samosir':'darat','pulau,':'darat'}, pos:{x:540,y:330}},
  {at:8.8,sampai:11.2,teks:'dan di dalam Samosir, ada danau lagi', kunci:{'danau':'air'}, pos:{x:540,y:330}},
  {at:14.6,sampai:16.6,teks:'Dulu Samosir bukan pulau', kunci:{'Samosir':'darat'}, pos:{x:80,y:330,rata:'kiri'}},
  {at:16.8,sampai:18.4,teks:'cuma lewat tanah sempit', kunci:{'tanah':'bahaya','sempit':'bahaya'}, pos:{x:80,y:330,rata:'kiri'}},

const suku=w=>Math.max(1,(w.toLowerCase().match(/[aiueo]+/g)||[]).length+(/\d/.test(w)?w.replace(/\D/g,'').length*.6:0));
function caption(){const box=$('#caption'),css=v=>getComputedStyle(document.body).getPropertyValue(v).trim(),putih=css('--tinta');
  NASKAH.forEach(f=>{const d=document.createElement('div');d.className='frasa';const ws=f.teks.split(/\s+/),pos=f.pos||{x:540,y:1380};
    ws.forEach(w=>{const s=document.createElement('span');s.className='k';s.textContent=w;d.appendChild(s);});box.appendChild(d);
    if(pos.rata==='kiri'){d.style.left=pos.x+'px';d.style.textAlign='left';}else{d.style.left=pos.x+'px';d.style.transform='translateX(-50%)';d.style.textAlign='center';}
    d.style.top=pos.y+'px';
    const spans=$$('.k',d),bicara=(f.sampai-f.at)*.85,tot=ws.reduce((a,w)=>a+suku(w),0);let t=f.at;
    tl.fromTo(d,{opacity:0,y:14},{opacity:1,y:0,duration:.22,ease:'power2.out',immediateRender:false},f.at-.12);
    spans.forEach((s,i)=>{const m=(f.kunci||{})[ws[i]];tl.set(s,{color:m?css('--'+m):putih},f.kata?f.kata[i]:t);if(!f.kata)t+=bicara*suku(ws[i])/tot;});
    tl.to(d,{opacity:0,duration:.2},f.sampai);});}

/* ================= LENSA "DULU", GRADASI ERA, AWAN, ANGKA TENGAH ================= */
function lensa(at,{sx=540,sy=960,r=230,isi,dur=.8,sampai}){   // lingkaran bercincin (posisi LAYAR — biasanya tengah, tempat kamera berhenti): di dalamnya lapisan "dulu"
  const ring=document.createElement('div');ring.style.cssText=`position:absolute;left:${sx}px;top:${sy}px;width:0;height:0;border-radius:50%;
    border:5px solid var(--emas);box-shadow:0 0 30px rgba(255,220,150,.6);transform:translate(-50%,-50%);opacity:0;pointer-events:none`;ring.dataset.tata='dekor';$('#stage').insertBefore(ring,$('#lapisLabel'));
  // isi lensa dipotong <clipPath> SVG dalam satuan PETA (clip-path CSS pada elemen SVG diukur dari kotak elemen itu sendiri)
  const vw=SW/C._z,ux=C._x+(sx-W/2)*vw/W,uy=C._y+(sy-H/2)*vw/W,ur=r*vw/W,id='lensa'+(lensa.n=(lensa.n||0)+1);
  const cp=el('clipPath',{id,clipPathUnits:'userSpaceOnUse'},defs),ci=el('circle',{cx:ux,cy:uy,r:0},cp);
  tl.set(isi,{attr:{'clip-path':`url(#${id})`,opacity:1}},at);
  tl.fromTo(ci,{attr:{r:0}},{attr:{r:ur},duration:dur,ease:'back.out(1.4)',immediateRender:false},at);
  tl.fromTo(ring,{width:0,height:0,opacity:1},{width:r*2,height:r*2,duration:dur,ease:'back.out(1.4)',immediateRender:false},at);
  if(sampai){tl.to(ring,{opacity:0,duration:.3},sampai);tl.set(isi,{attr:{'clip-path':'none'}},sampai);}}
function gradasi(at,{sepia=0,saturasi=1,terang=1,dur=1}){const o=gradasi.o||(gradasi.o={s:0,t:1,b:1});
  tl.to(o,{s:sepia,t:saturasi,b:terang,duration:dur,ease:'sine.inOut',onUpdate(){svg.style.filter=`sepia(${o.s}) saturate(${o.t}) brightness(${o.b})`;}},at);}
const AW=[...Array(9)].map((_,i)=>{const d=document.createElement('div');d.className='awan';$('#awan').appendChild(d);
  const w=380+rnd(i,9)*420;Object.assign(d.style,{width:w+'px',height:w*.62+'px',left:(rnd(i,3)*1080-w/2)+'px',top:(rnd(i,4)*1920-w*.3)+'px'});return d;});

function angkaTengah(at,sampai){tl.fromTo('#tengah',{opacity:0,scale:.9},{opacity:1,scale:1,duration:.5,ease:'back.out(1.6)',immediateRender:false},at);tl.to('#tengah',{opacity:0,duration:.4},sampai);}

/* ================= SILANG, MORF, TEMBUS (perpustakaan; lihat reels-dokumenter.md) ================= */
function silang(at,{x,y,ukuran=180,warna='#ff6b5b',induk=lsvg}){   // tanda silang merah tergambar di layar (x,y)
  const h=ukuran/2,a=el('path',{d:`M${x-h} ${y-h}L${x+h} ${y+h}`,stroke:warna,'stroke-width':8,'stroke-linecap':'round',fill:'none'},induk),
    b=el('path',{d:`M${x+h} ${y-h}L${x-h} ${y+h}`,stroke:warna,'stroke-width':8,'stroke-linecap':'round',fill:'none'},induk);
  [a,b].forEach((p,i)=>{const L=p.getTotalLength();p.style.strokeDasharray=L;tl.fromTo(p,{strokeDashoffset:L},{strokeDashoffset:0,duration:.3,ease:'power2.out',immediateRender:false},at+i*.18);});return [a,b];}
function contoh(path,n=96){const L=path.getTotalLength();return [...Array(n)].map((_,i)=>{const p=path.getPointAtLength(L*i/n);return [p.x,p.y];});}
function morf(path,dTujuan,at,dur=1){   // bentuk A → bentuk B (keduanya diambil 96 titik merata; titik awal diselaraskan)
  const A=contoh(path),tmp=el('path',{d:dTujuan},defs),B0=contoh(tmp);tmp.remove();let best=0,bd=1e18;
  for(let s=0;s<B0.length;s++){let d=0;for(let i=0;i<A.length;i+=8){const b=B0[(i+s)%B0.length];d+=(A[i][0]-b[0])**2+(A[i][1]-b[1])**2;}if(d<bd){bd=d;best=s;}}
  const B=A.map((_,i)=>B0[(i+best)%B0.length]),o={t:0};
  tl.fromTo(o,{t:0},{t:1,duration:dur,ease:'power2.inOut',immediateRender:false,onUpdate(){path.setAttribute('d','M'+A.map((a,i)=>[(a[0]+(B[i][0]-a[0])*o.t).toFixed(1),(a[1]+(B[i][1]-a[1])*o.t).toFixed(1)].join(' ')).join('L')+'Z');}},at);}
function tembus(at,luar,dalam,dur=.8){   // tembus pandang: kulit luar memudar & menyala, isi dalam muncul bergiliran
  tl.to(luar,{opacity:.28,filter:'drop-shadow(0 0 18px rgba(255,190,90,.8))',duration:dur},at);
  tl.fromTo(dalam,{opacity:0,scale:.92},{opacity:1,scale:1,duration:.5,stagger:.15,ease:'power2.out',immediateRender:false},at+dur*.5);}

/* ---------- kontrol: autoplay + loop tanpa player; ?debug=1 panel; ?clean=1 export ---------- */
const q=new URLSearchParams(location.search),vo=$('#vo'),hasVO=!!vo.getAttribute('src');let audioOn=false;
function start(){tl.play(0);if(hasVO){vo.currentTime=0;vo.play().then(()=>audioOn=true).catch(()=>{});}}
tl.eventCallback('onComplete',()=>start());
gsap.ticker.add(()=>{if(!audioOn||tl.paused())return;if(Math.abs(vo.currentTime-tl.time())>.12)vo.currentTime=tl.time();});
window.OPENER={W,H,DURATION:DUR,tl,ready:false,seek(t){tl.pause(t,false);applyCam();if(gsap.ticker.tick)gsap.ticker.tick();}   /* pause(t,false): callback onUpdate ikut jalan saat scrub/snapshot */,play:start};
/* ================= FOOTAGE — layer video yang terikat timeline (seperti footage di After Effects) =================
   Markup : <div class="clipbox"><video class="clip" src="assets/klip.mp4" muted playsinline preload="auto"></video></div>
   Pasang : const k = clip($('#v1'), {at:4, in:1.5, out:6, rate:1, hold:false});
            at = detik timeline klip mulai · in/out = potongan sumber (dtk) · rate = kecepatan · hold = tahan frame akhir
   Animasi: tween PEMBUNGKUSNYA dengan tl (posisi, skala, mask, opacity, filter). Isi video mengikuti jam timeline,
            bukan jamnya sendiri — scrub ?debug=1, snap.mjs, dan export-frames.mjs (OPENER.seekFrame) tetap presisi.
   Format : MP4 H.264 (yuv420p, +faststart) atau WebM VP9, tanpa suara, 720p–1080p, 3–8 dtk per klip. */
var CLIPS = CLIPS || [];
function clip(el, o){ o = o || {}; el.muted = true; el.playsInline = true; el.preload = 'auto'; el.loop = false;
  try { el.pause(); } catch(e) {}
  var c = { el: el, at: o.at || 0, inT: o.in || 0, out: (o.out == null ? null : o.out), rate: o.rate || 1, hold: !!o.hold };
  (CLIPS = CLIPS || []).push(c); return c; }
function clipTime(c, t){ var end = c.out != null ? c.out : (isFinite(c.el.duration) ? c.el.duration : 1e9);
  var lt = (t - c.at) * c.rate; if (lt < 0) return null; var vt = c.inT + lt;
  if (vt > end - 1/120) { if (!c.hold) return null; vt = end - 1/60; } return vt; }
function syncClips(t, playing){ for (var i = 0; i < CLIPS.length; i++){ var c = CLIPS[i], v = c.el, vt = clipTime(c, t);
  if (vt === null) { if (!v.paused) v.pause(); continue; }
  if (playing) { if (v.playbackRate !== c.rate) v.playbackRate = c.rate; if (v.paused) v.play().catch(function(){});
    if (Math.abs(v.currentTime - vt) > .2) v.currentTime = vt; }
  else { if (!v.paused) v.pause(); if (Math.abs(v.currentTime - vt) > 1/90) v.currentTime = vt; } } }
function seekClips(t){ return Promise.all(CLIPS.map(function(c){ return new Promise(function(res){
  var v = c.el, vt = clipTime(c, t); try { v.pause(); } catch(e) {}
  if (vt === null) return res();
  var fin = function(){ requestAnimationFrame(function(){ requestAnimationFrame(res); }); };
  if (Math.abs(v.currentTime - vt) < 1/240 && v.readyState >= 2) return fin();
  var to = setTimeout(res, 4000);
  v.addEventListener('seeked', function h(){ v.removeEventListener('seeked', h); clearTimeout(to); fin(); });
  v.currentTime = vt; }); })); }
gsap.ticker.add(function(){ if (CLIPS.length) syncClips(window.OPENER.tl.time(), !window.OPENER.tl.paused()); });
window.OPENER.clipsReady = function(){ return CLIPS.every(function(c){ return c.el.readyState >= 2; }); };
window.OPENER.seekFrame = function(t){ window.OPENER.seek(t); return seekClips(t); };   // ekspor/snap: tunggu frame klip
addEventListener('keydown',e=>{if(/^[rR]$/.test(e.key))start();if(e.code==='Space'){e.preventDefault();tl.paused()?tl.play():tl.pause();}});
if(q.has('debug')){const dbg=$('#dbg');dbg.style.display='flex';const sc=$('#dScrub'),ck=$('#dClock');let drag=false;
  gsap.ticker.add(()=>{if(!drag)sc.value=String(tl.time()/DUR*1000);ck.textContent=tl.time().toFixed(2)+'s';$('#dPlay').textContent=tl.paused()?'Play':'Pause';});
  sc.addEventListener('pointerdown',()=>{drag=true;tl.pause();});addEventListener('pointerup',()=>drag=false);
  sc.addEventListener('input',()=>{tl.pause();tl.time(sc.value/1000*DUR);});$('#dPlay').onclick=()=>tl.paused()?tl.play():tl.pause();}
/* ================= SUARA Motion Format — VO per adegan + efek suara (ElevenLabs), terikat timeline =================
   Isi AUDIO_PLAN saja; sisanya otomatis: ikut scrub ?debug=1, pause, loop, dan dibaca scripts/render_mp4.py untuk mix MP4.
   vo   : satu klip per adegan  {at: detik mulai bicara, src:'assets/audio/vo1.mp3', vol:1}
   sfx  : efek suara pendek     {at: detik bunyi,        src:'assets/audio/sfx-pop.mp3', vol:.5}
   music: format Reels dokumenter memakai musik latar tipis terus-menerus → {src:'assets/audio/music.mp3', vol:.12}
   Panduan lengkap: references/suara-elevenlabs.md */
window.AUDIO_PLAN = window.AUDIO_PLAN || { vo: [], sfx: [], music: null };
var MF = (function(){
  var P = window.AUDIO_PLAN, T = window.OPENER.tl, on = false, last = 0, noop = function(){};
  function mk(s, music){ var a = new Audio(s.src); a.preload = 'auto'; a.volume = s.vol == null ? (music ? .15 : 1) : s.vol;
    return { at: s.at || 0, el: a, music: !!music }; }
  var LONG = (P.vo || []).map(function(s){ return mk(s); }).concat(P.music ? [mk(P.music, true)] : []);
  var SFX = (P.sfx || []).map(function(s){ return mk(s); });
  var ALL = LONG.concat(SFX);
  function unlock(){ on = true; }
  addEventListener('pointerdown', unlock, { once: true }); addEventListener('keydown', unlock, { once: true });
  gsap.ticker.add(function(){
    var t = T.time(), playing = !T.paused();
    if (!on) { last = t; return; }
    for (var i = 0; i < LONG.length; i++){ var c = LONG[i], d = c.el.duration, rel = t - c.at;
      var inside = rel >= 0 && (c.music || !d || !isFinite(d) || rel < d);
      if (playing && inside){ var want = c.music && d && isFinite(d) ? rel % d : rel;
        if (Math.abs(c.el.currentTime - want) > .25) c.el.currentTime = want;
        if (c.el.paused) c.el.play().catch(noop); }
      else if (!c.el.paused) c.el.pause(); }
    if (playing){ if (t < last) last = -.001;                       // loop: mulai lagi dari awal
      if (t - last < .5) for (var j = 0; j < SFX.length; j++){ var s = SFX[j];
        if (s.at > last && s.at <= t){ s.el.currentTime = 0; s.el.play().catch(noop); } } }
    last = t;
  });
  return {
    has: ALL.length > 0,
    /* uji autoplay bersuara: resolve bila browser mengizinkan, reject bila harus menunggu klik/tombol pertama */
    probe: function(){ var a = ALL[0].el, v = a.volume; a.volume = 0;
      return a.play().then(function(){ a.pause(); a.currentTime = 0; a.volume = v; on = true; }, function(e){ a.volume = v; throw e; }); }
  };
})();
document.fonts.ready.then(()=>{applyCam();window.OPENER.ready=true;if(q.has('clean'))return;
  if(!hasVO&&!MF.has){start();return;}
  (hasVO?vo.play():MF.probe()).then(()=>{audioOn=hasVO;vo.currentTime=0;tl.play(0);}).catch(()=>{const go=()=>{removeEventListener('pointerdown',go);removeEventListener('keydown',go);start();};addEventListener('pointerdown',go);addEventListener('keydown',go);});});
</script>
