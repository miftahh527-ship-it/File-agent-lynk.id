<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Let.growww — Intro (Konsep 3: Huruf jadi tanaman)</title>
<link rel="stylesheet" href="../../shared/mf-style.css">
<style>
  #band{position:absolute;left:-60px;top:760px;width:2040px;height:1200px;z-index:2;
    background:radial-gradient(ellipse at 50% 0%,#7A4E36 0%,#5E3B27 40%,#3F2618 100%);border-radius:50% 50% 0 0/50px 50px 0 0}
  #band .bg-grain{opacity:.4}
  #mask{position:absolute;left:0;top:0;width:1920px;height:772px;overflow:hidden;z-index:3}
  #wm{left:0;width:1920px;top:520px;text-align:center;font-size:220px}
  #wm .lf{position:absolute;width:.24em;height:.24em;left:58%;top:-.4em;transform-origin:0 100%}
  .crumb{position:absolute;width:14px;height:14px;border-radius:50%;background:#6B4430;z-index:4;opacity:0}
  #seedDot{position:absolute;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:var(--marigold);z-index:5}
  #badge{left:790px;top:110px;width:340px;height:340px;z-index:5}
  #tag{left:0;width:1920px;top:860px;text-align:center;font-size:60px;color:#FBEBD0;z-index:4;letter-spacing:.03em}
  /* Perhatian di atas tanah gelap */
  #warn{z-index:10;opacity:0}
  #wt{position:absolute;left:250px;top:150px;display:flex;align-items:center;gap:26px;height:140px;overflow:hidden}
  #wt .ico{width:110px;height:110px}
  #wtitle{font:600 110px var(--display);color:var(--marigold);line-height:1}
  #wtitle .ch{display:inline-block}
  #body{position:absolute;left:250px;top:330px;width:1420px;font:600 54px/1.42 var(--body);color:#FBEBD0}
  #body .wd{display:inline-block}
  #thanks{position:absolute;left:250px;top:770px;font:600 70px var(--display);color:#B5D37A;display:flex;align-items:center;gap:16px}
  #thanks .lf{width:64px;height:64px}
  #peek{left:1560px;top:700px;width:240px;height:240px}
  #blackout{position:absolute;inset:0;background:#000;opacity:0;z-index:30}
</style>
</head>
<body>
<div id="stage">
  <div class="layer" id="bg"></div>
  <div id="world">
    <div id="mask"><div class="wm" id="wm">Let.growww</div></div>
    <div id="band"><div class="bg-grain"></div></div>
    <div id="seedDot"></div>
    <div class="badge" id="badge"><img src="../../shared/img/logo-badge.png" alt="Maskot Let.growww"></div>
    <div class="tag" id="tag">mari bertumbuh bersama</div>
  </div>
  <div class="layer" id="warn">
    <div class="layer" id="wbg"></div>
    <div id="wt"><span class="ico" id="wico"></span><span id="wtitle">Perhatian</span></div>
    <div id="body">Informasi yang kami sajikan adalah berdasarkan data. Untuk menghindari ketidak akuratan informasi, mohon dipastikan terlebih dahulu agar data sesuai dan tervalidasi.</div>
    <div id="thanks"><span class="lf" id="tlf"></span><span id="ttxt">Terima Kasih</span></div>
    <div class="badge" id="peek"><img src="../../shared/img/logo-badge.png" alt=""></div>
  </div>
  <div id="blackout"></div>
</div>
<script src="../../shared/vendor/gsap.min.js"></script>
<script src="../../shared/mf-runtime.js"></script>
<script>
window.AUDIO_PLAN = { vo: [], music: null, sfx: [
  { at: .05, src: '../../shared/audio/sfx-whoosh.mp3',  vol: .4 },
  { at: .5,  src: '../../shared/audio/sfx-sprout.mp3',  vol: .45 },
  { at: 1.3, src: '../../shared/audio/sfx-jingle.mp3',  vol: .6 },
  { at: 2.1, src: '../../shared/audio/sfx-pop.mp3',     vol: .4 },
  { at: 2.5, src: '../../shared/audio/sfx-sparkle.mp3', vol: .45 },
  { at: 3.0, src: '../../shared/audio/sfx-pop.mp3',     vol: .3 },
  { at: 4.4, src: '../../shared/audio/sfx-whoosh.mp3',  vol: .55 },
  { at: 5.2, src: '../../shared/audio/sfx-sprout.mp3',  vol: .4 },
  { at: 5.6, src: '../../shared/audio/sfx-bell.mp3',    vol: .35 },
  { at: 7.0, src: '../../shared/audio/sfx-pop.mp3',     vol: .35 },
]};
const { $ } = MF;
const G = MF.garden($('#bg'), { seed: 51, leaves: 5, base: 'linear-gradient(180deg,#FFF8E8 0%,#F7EBD3 70%,#EEDCB8 100%)' });
const G2 = MF.garden($('#wbg'), { seed: 52, leaves: 3, pollen: 26,
  base: 'radial-gradient(ellipse at 30% 0%,#6E4630 0%,#4E3020 50%,#331E13 100%)',
  sun: 'radial-gradient(circle,rgba(255,200,120,.22) 0%,rgba(255,200,120,0) 60%)' });
$('#wico').innerHTML = MF.ICON.warn; $('#tlf').innerHTML = MF.leafSVG('#B5D37A', '#5E8C3A');
const W = MF.wordmark($('#wm'));
[7, 8, 9].forEach(i => { const l = document.createElement('span'); l.className = 'lf'; l.innerHTML = MF.leafSVG(); W[i].style.position = 'relative'; W[i].appendChild(l); });
const leafs = [7, 8, 9].map(i => W[i].querySelector('.lf'));
const TAG = MF.words($('#tag')), BODY = MF.words($('#body')), WT = MF.chars($('#wtitle'));
// remah tanah di kaki tiap huruf
const R = MF.rand(9);
const CR = W.map(() => Array.from({ length: 4 }, () => { const c = document.createElement('div'); c.className = 'crumb'; $('#world').appendChild(c);
  return { el: c, dx: (R() - .5) * 120, up: 40 + R() * 70 }; }));
const cx = el => () => el.offsetLeft + el.offsetWidth / 2;   // pusat huruf (dibaca saat tween mulai, setelah font termuat)

MF.boot({
  duration: 13,
  build(tl) {
    gsap.set('#band', { y: 360 });
    gsap.set(W, { y: 300 });
    gsap.set(leafs, { scale: 0, rotation: -50 });
    gsap.set('#seedDot', { opacity: 0 });
    gsap.set('#badge', { clipPath: 'circle(0% at 50% 50%)' });
    gsap.set(TAG, { y: 50, opacity: 0 });
    // 1. tanah naik
    tl.to('#band', { y: 0, duration: .55, ease: 'power3.out' }, 0);
    // 2. huruf menyembul dari tanah satu per satu
    W.forEach((c, i) => {
      const at = .5 + i * .09;
      tl.to(c, { y: 0, duration: .7, ease: 'elastic.out(1,.6)' }, at);
      CR[i].forEach(k => tl.fromTo(k.el, { x: cx(c), y: 768, opacity: 1, scale: 1 },
        { x: () => cx(c)() + k.dx, y: 768 - k.up, opacity: 0, scale: .4, duration: .5, ease: 'power2.out', immediateRender: false }, at + .05));
    });
    leafs.forEach((l, i) => tl.to(l, { scale: 1, rotation: 0, duration: .5, ease: 'back.out(3)' }, 1.55 + i * .12));
    // 3. titik "Let." melompat dan mekar jadi maskot
    const dot = W[3];
    tl.fromTo('#seedDot', { x: () => dot.offsetLeft + dot.offsetWidth / 2, y: 700, opacity: 1, scale: 1 },
      { x: 960, duration: .45, ease: 'power1.inOut', immediateRender: false }, 2.1)
      .to('#seedDot', { y: 280, duration: .45, ease: 'power2.out' }, 2.1)
      .to('#seedDot', { scale: 7.7, duration: .3, ease: 'power2.in' }, 2.4)
      .to('#badge', { clipPath: 'circle(72% at 50% 50%)', duration: .45, ease: 'back.out(1.5)' }, 2.5)
      .to('#seedDot', { opacity: 0, duration: .2 }, 2.6);
    // 4. tagline di atas tanah
    TAG.forEach((w, i) => tl.to(w, { y: 0, opacity: 1, duration: .45, ease: 'power3.out' }, 3.0 + i * .09));
    MF.blur(tl, TAG, 3.0, .5, { from: 12 });
    tl.to('#world', { scale: 1.035, transformOrigin: '960px 600px', duration: 1.4, ease: 'sine.inOut' }, 3.1);
    // 5. tanah naik menutup layar → Perhatian
    tl.to('#band', { y: -800, duration: .55, ease: 'power3.in' }, 4.4)
      .set('#warn', { opacity: 1 }, 4.95)
      .set('#world', { opacity: 0 }, 4.95);
    gsap.set(WT, { y: 150 }); gsap.set('#wico', { scale: 0, rotation: -30 });
    gsap.set(BODY, { y: 30, opacity: 0 }); gsap.set('#thanks', { opacity: 0, y: 40 }); gsap.set('#tlf', { scale: 0 });
    gsap.set('#peek', { scale: 0 });
    tl.to('#wico', { scale: 1, rotation: 0, duration: .5, ease: 'back.out(2.6)' }, 5.1);
    WT.forEach((c, i) => tl.to(c, { y: 0, duration: .6, ease: 'elastic.out(1,.6)' }, 5.2 + i * .05));
    BODY.forEach((w, i) => tl.to(w, { y: 0, opacity: 1, duration: .4, ease: 'power3.out' }, 5.9 + i * .035));
    MF.blur(tl, BODY, 5.9, 1.2, { from: 8 });
    tl.to('#thanks', { opacity: 1, y: 0, duration: .5, ease: 'back.out(2)' }, 6.85)
      .to('#tlf', { scale: 1, duration: .5, ease: 'back.out(3)' }, 7.0)
      .to('#peek', { scale: 1, duration: .55, ease: 'back.out(2)' }, 7.0)
      .to('#peek', { rotation: 7, duration: .9, yoyo: true, repeat: 4, ease: 'sine.inOut' }, 7.6)
      .to('#blackout', { opacity: 1, duration: .6, ease: 'power1.in' }, 12.4);
  },
  render(t) {
    G.update(t); if (t > 4.4) G2.update(t);
    // huruf bergoyang seperti tanaman tertiup angin
    if (t > 2.0) W.forEach((c, i) => { c.style.transform = `skewX(${Math.sin(t * 1.8 + i * .6) * 2.5}deg)`; });
    if (t > 2.4) leafs.forEach((l, i) => { l.style.transform = `rotate(${Math.sin(t * 2.4 + i) * 10}deg)`; });
  }
});
</script>
</body>
</html>
