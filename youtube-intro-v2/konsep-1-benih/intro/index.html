<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Let.growww — Intro (Konsep 1: Benih tumbuh)</title>
<link rel="stylesheet" href="../../shared/mf-style.css">
<style>
  /* ---- adegan intro ---- */
  #soil{left:-200px;top:905px;width:2320px;height:400px;border-radius:50% 50% 0 0/60px 60px 0 0}
  #mound{left:700px;top:842px;width:520px;height:120px;border-radius:50% 50% 0 0/100% 100% 0 0}
  #seed{position:absolute;left:928px;top:772px;width:64px;height:84px;border-radius:50% 50% 46% 46%/58% 58% 42% 42%;
    background:radial-gradient(circle at 35% 30%,#B07A55,#8A5A3B 55%,#6B4430);box-shadow:inset -6px -8px 0 rgba(0,0,0,.12)}
  #sprout{position:absolute;left:860px;top:600px;width:200px;height:200px;overflow:visible}
  #badge{left:770px;top:170px;width:380px;height:380px}
  #wm{left:0;width:1920px;top:600px;text-align:center;font-size:160px}
  #wm .lf{position:absolute;width:.24em;height:.24em;left:58%;top:-.4em;transform-origin:0 100%}
  #tag{left:0;width:1920px;top:800px;text-align:center;font-size:54px;letter-spacing:.04em}
  .tuft{position:absolute;width:90px;height:60px}
  #sweep{position:absolute;left:0;top:-700px;width:2600px;height:2600px;z-index:20}
  /* ---- layar Perhatian ---- */
  #warn{opacity:0}
  #board{left:240px;top:150px;width:1440px;height:640px}
  #board .post{top:590px;height:360px}
  #note{position:absolute;left:40px;top:40px;right:40px;bottom:40px;border-radius:18px;padding:44px 70px;
    background:linear-gradient(180deg,#FFFBF1,#F8EEDA);box-shadow:0 6px 14px rgba(74,46,29,.2)}
  #note h1{display:flex;align-items:center;gap:22px;font:600 88px var(--display);color:var(--ink);line-height:1}
  #note h1 .ico{width:96px;height:96px}
  #body{margin-top:26px;font:600 48px/1.38 var(--body);color:var(--ink)}
  #body .wd{display:inline-block}
  #thanks{margin-top:26px;font:600 56px var(--display);color:var(--leaf)}
  #peek{left:1560px;top:560px;width:250px;height:250px;z-index:3}
  #blackout{position:absolute;inset:0;background:#000;opacity:0;z-index:30}
</style>
</head>
<body>
<div id="stage">
  <div class="layer" id="bg"></div>
  <div id="world">
    <div class="soil" id="soil"></div>
    <div class="soil" id="mound"></div>
    <div id="seed"></div>
    <svg id="sprout" viewBox="0 0 200 200">
      <path id="stem" d="M100 192 C 100 150, 104 120, 100 92" stroke="#5E8C3A" stroke-width="12" fill="none" stroke-linecap="round"/>
      <g id="lfL" style="transform-origin:100px 96px"><path d="M100 96 C 70 96, 40 80, 30 52 C 64 46, 92 64, 100 96 Z" fill="#9CC45E"/></g>
      <g id="lfR" style="transform-origin:100px 96px"><path d="M100 96 C 130 96, 160 80, 170 52 C 136 46, 108 64, 100 96 Z" fill="#B5D37A"/></g>
    </svg>
    <div class="badge" id="badge"><img src="../../shared/img/logo-badge.png" alt="Maskot Let.growww"></div>
    <div class="wm" id="wm">Let.growww</div>
    <div class="tag" id="tag">mari bertumbuh bersama</div>
  </div>
  <div class="layer" id="warn">
    <div class="sign" id="board">
      <div class="post" style="left:240px"></div><div class="post" style="right:240px"></div>
      <div class="board"></div>
      <div id="note">
        <h1><span class="ico" id="wico"></span><span id="wtitle">Perhatian</span></h1>
        <div id="body">Informasi yang kami sajikan adalah berdasarkan data. Untuk menghindari ketidak akuratan informasi, mohon dipastikan terlebih dahulu agar data sesuai dan tervalidasi.</div>
        <div id="thanks">Terima Kasih</div>
      </div>
    </div>
    <div class="badge" id="peek"><img src="../../shared/img/logo-badge.png" alt=""></div>
  </div>
  <div id="sweep"></div>
  <div id="blackout"></div>
</div>
<script src="../../shared/vendor/gsap.min.js"></script>
<script src="../../shared/mf-runtime.js"></script>
<script>
/* SUARA — efek suara ElevenLabs (lihat ../../vo-script.md). Dibaca juga oleh render_mp4.py. */
window.AUDIO_PLAN = { vo: [], music: null, sfx: [
  { at: .52, src: '../../shared/audio/sfx-plop.mp3',    vol: .55 },
  { at: .72, src: '../../shared/audio/sfx-sprout.mp3',  vol: .45 },
  { at: 1.6, src: '../../shared/audio/sfx-sparkle.mp3', vol: .45 },
  { at: 2.0, src: '../../shared/audio/sfx-jingle.mp3',  vol: .6  },
  { at: 3.05,src: '../../shared/audio/sfx-pop.mp3',     vol: .35 },
  { at: 4.42,src: '../../shared/audio/sfx-whoosh.mp3',  vol: .5  },
  { at: 5.42,src: '../../shared/audio/sfx-wood.mp3',    vol: .55 },
  { at: 5.75,src: '../../shared/audio/sfx-bell.mp3',    vol: .35 },
  { at: 7.25,src: '../../shared/audio/sfx-pop.mp3',     vol: .35 },
]};
const { $ } = MF;
const G = MF.garden($('#bg'), { seed: 11 });
$('#wico').innerHTML = MF.ICON.warn;
$('#sweep').innerHTML = MF.leafSVG('#9CC45E', '#5E8C3A');
const W = MF.wordmark($('#wm'));
[7, 8, 9].forEach(i => { const l = document.createElement('span'); l.className = 'lf'; l.innerHTML = MF.leafSVG(); W[i].style.position = 'relative'; W[i].appendChild(l); });
const leafs = [7, 8, 9].map(i => W[i].querySelector('.lf'));
const TAG = MF.words($('#tag'));
const BODY = MF.words($('#body'));
// rumput kecil di tepi tanah
const R = MF.rand(3);
for (let i = 0; i < 14; i++) { const t = document.createElement('div'); t.className = 'tuft';
  t.innerHTML = `<svg viewBox="0 0 90 60"><path d="M10 60 Q 18 20 26 2 Q 30 30 34 60 M40 60 Q 46 14 58 0 Q 56 32 60 60 M62 60 Q 72 28 84 12 Q 76 40 74 60" fill="#7BAA48"/></svg>`;
  t.style.left = (i * 140 + R() * 60 - 40) + 'px'; t.style.top = (858 + R() * 20) + 'px'; $('#world').appendChild(t); }

MF.boot({
  duration: 13,
  build(tl) {
    gsap.set('#world', { scale: 1.75, transformOrigin: '960px 800px' });
    gsap.set('#seed', { y: -1000, rotation: -30 });
    gsap.set('#stem', { strokeDasharray: 120, strokeDashoffset: 120 });
    gsap.set(['#lfL', '#lfR'], { scale: 0 });
    gsap.set('#badge', { clipPath: 'circle(0% at 50% 100%)', scale: .9 });
    gsap.set(W, { scaleY: 0, scaleX: .6, opacity: 0 });
    gsap.set(leafs, { scale: 0, rotation: -40 });
    gsap.set(TAG, { y: 40, opacity: 0 });
    gsap.set('#sweep', { x: 2100, rotation: 20 });

    // 1. benih jatuh ke tanah
    tl.to('#seed', { y: 0, rotation: 0, duration: .5, ease: 'power2.in' }, .02)
      .to('#seed', { scaleY: .72, scaleX: 1.22, duration: .08, transformOrigin: '50% 100%' }, .52)
      .to('#seed', { scaleY: 1, scaleX: 1, duration: .45, ease: 'elastic.out(1,.45)' }, .6);
    // 2. tunas tumbuh
    tl.to('#stem', { strokeDashoffset: 0, duration: .5, ease: 'power2.out' }, .72)
      .to('#lfL', { scale: 1, duration: .5, ease: 'back.out(2.4)' }, 1.0)
      .to('#lfR', { scale: 1, duration: .5, ease: 'back.out(2.4)' }, 1.08);
    // 3. kamera mundur, benih + tunas mekar jadi maskot
    tl.to('#world', { scale: 1, duration: .85, ease: 'power3.inOut' }, 1.25)
      .to(['#seed', '#sprout'], { y: -260, scale: .35, opacity: 0, duration: .55, ease: 'power2.in' }, 1.3)
      .to('#mound', { scaleY: .3, opacity: 0, transformOrigin: '50% 100%', duration: .5 }, 1.4)
      .to('#badge', { clipPath: 'circle(72% at 50% 50%)', scale: 1, duration: .7, ease: 'back.out(1.6)' }, 1.45);
    // 4. huruf tumbuh dari tanah (tiga w bertunas)
    W.forEach((c, i) => {
      tl.to(c, { scaleY: 1, scaleX: 1, opacity: 1, duration: .55, ease: 'elastic.out(1,.55)' }, 2.0 + i * .05);
    });
    MF.blur(tl, W, 2.0, .5, { from: 16 });
    leafs.forEach((l, i) => tl.to(l, { scale: 1, rotation: 0, duration: .45, ease: 'back.out(3)' }, 2.55 + i * .1));
    // 5. tagline
    TAG.forEach((w, i) => tl.to(w, { y: 0, opacity: 1, duration: .5, ease: 'power3.out' }, 3.05 + i * .09));
    MF.blur(tl, TAG, 3.05, .55, { from: 12 });
    // 6. napas kamera lalu daun besar menyapu lensa
    tl.to('#world', { scale: 1.04, duration: 1.3, ease: 'sine.inOut' }, 3.2)
      .to('#sweep', { x: -2700, rotation: -10, duration: .62, ease: 'power2.inOut' }, 4.4)
      .set('#world', { opacity: 0 }, 4.72)
      .set('#warn', { opacity: 1 }, 4.72);

    // ===== Perhatian =====
    gsap.set('#board', { y: 980, rotation: -3 });
    gsap.set('#wico', { scale: 0, rotation: -30 });
    gsap.set('#wtitle', { x: -40, opacity: 0 });
    gsap.set(BODY, { y: 26, opacity: 0 });
    gsap.set('#thanks', { scale: .4, opacity: 0, transformOrigin: '0% 50%' });
    gsap.set('#peek', { x: 300, rotation: 30 });
    tl.to('#board', { y: 0, duration: .55, ease: 'power3.out' }, 4.9)
      .to('#board', { rotation: 0, duration: .6, ease: 'elastic.out(1,.4)' }, 5.42)
      .to('#board', { y: 8, duration: .08, yoyo: true, repeat: 1 }, 5.42)
      .to('#wico', { scale: 1, rotation: 0, duration: .5, ease: 'back.out(2.6)' }, 5.7)
      .to('#wtitle', { x: 0, opacity: 1, duration: .5, ease: 'power3.out' }, 5.78);
    MF.blur(tl, '#wtitle', 5.78, .5, { from: 16, ax: 1, ay: .08 });
    BODY.forEach((w, i) => tl.to(w, { y: 0, opacity: 1, duration: .4, ease: 'power3.out' }, 6.05 + i * .035));
    tl.to('#thanks', { scale: 1, opacity: 1, duration: .6, ease: 'back.out(2)' }, 7.0)
      .to('#peek', { x: 0, rotation: -8, duration: .6, ease: 'back.out(1.8)' }, 7.2)
      .to('#peek', { rotation: 6, duration: .9, ease: 'sine.inOut', yoyo: true, repeat: 4 }, 7.8)
      .to('#board', { scale: 1.025, transformOrigin: '50% 60%', duration: 4.5, ease: 'sine.inOut' }, 7.6)
      .to('#blackout', { opacity: 1, duration: .6, ease: 'power1.in' }, 12.4);
  },
  render(t) {
    G.update(t);
    // tunas & daun huruf bergoyang pelan (fungsi waktu, deterministik)
    leafs.forEach((l, i) => { if (t > 3.3) l.style.transform = `rotate(${Math.sin(t * 2.4 + i) * 9}deg) scale(1)`; });
  }
});
</script>
</body>
</html>
