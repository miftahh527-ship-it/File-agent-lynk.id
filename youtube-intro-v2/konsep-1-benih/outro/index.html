<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Let.growww — Outro (Konsep 1: Benih tumbuh)</title>
<link rel="stylesheet" href="../../shared/mf-style.css">
<style>
  #soil{left:-200px;top:925px;width:2320px;height:400px;border-radius:50% 50% 0 0/60px 60px 0 0}
  #seed{position:absolute;left:928px;top:300px;width:64px;height:84px;border-radius:50% 50% 46% 46%/58% 58% 42% 42%;
    background:radial-gradient(circle at 35% 30%,#B07A55,#8A5A3B 55%,#6B4430)}
  #mound{left:760px;top:372px;width:400px;height:90px;border-radius:50% 50% 0 0/100% 100% 0 0}
  #sprout{position:absolute;left:860px;top:128px;width:200px;height:200px;overflow:visible}
  #badge{left:820px;top:70px;width:280px;height:280px}
  #thx{position:absolute;left:0;width:1920px;top:410px;text-align:center;font:600 84px var(--display);color:var(--ink)}
  #thx .wd{display:inline-block;transform-origin:50% 100%}
  #sub{position:absolute;left:0;width:1920px;top:528px;text-align:center;font:700 44px var(--body);color:var(--brown)}
  #sub .wd{display:inline-block}
  .stake{position:absolute;width:40px;height:220px;background:linear-gradient(90deg,#8E5C37,#A9733F,#7C4E2D);border-radius:8px}
  .plant{position:absolute;top:660px;width:780px;height:420px}
  .plant .social{left:0;top:0}
  .plant .stake{top:150px;left:370px}
  #yt{left:150px} #ig{left:990px}
  .tuft{position:absolute;width:90px;height:60px}
  .hrt{position:absolute;width:44px;height:44px;opacity:0}
  #blackout{position:absolute;inset:0;background:#000;opacity:0;z-index:30}
</style>
</head>
<body>
<div id="stage">
  <div class="layer" id="bg"></div>
  <div id="world">
    <div class="soil" id="soil"></div>
    <div class="plant" id="yt"><div class="stake"></div></div>
    <div class="plant" id="ig"><div class="stake"></div></div>
    <div class="soil" id="mound"></div>
    <div id="seed"></div>
    <svg id="sprout" viewBox="0 0 200 200">
      <path id="stem" d="M100 192 C 100 150, 104 120, 100 92" stroke="#5E8C3A" stroke-width="12" fill="none" stroke-linecap="round"/>
      <g id="lfL" style="transform-origin:100px 96px"><path d="M100 96 C 70 96, 40 80, 30 52 C 64 46, 92 64, 100 96 Z" fill="#9CC45E"/></g>
      <g id="lfR" style="transform-origin:100px 96px"><path d="M100 96 C 130 96, 160 80, 170 52 C 136 46, 108 64, 100 96 Z" fill="#B5D37A"/></g>
    </svg>
    <div class="badge" id="badge"><img src="../../shared/img/logo-badge.png" alt="Maskot Let.growww"></div>
    <div id="thx">Terima Kasih sudah menonton video kami.</div>
    <div id="sub">Jangan lupa Subscribe, like, komen dan follow platform sosial kami ya :)</div>
  </div>
  <div class="cursor" id="cur"></div>
  <div class="ripple" id="rip"></div>
  <div id="blackout"></div>
</div>
<script src="../../shared/vendor/gsap.min.js"></script>
<script src="../../shared/mf-runtime.js"></script>
<script>
window.AUDIO_PLAN = { vo: [], music: null, sfx: [
  { at: .4,  src: '../../shared/audio/sfx-plop.mp3',    vol: .5 },
  { at: .55, src: '../../shared/audio/sfx-sprout.mp3',  vol: .4 },
  { at: 1.3, src: '../../shared/audio/sfx-sparkle.mp3', vol: .4 },
  { at: 1.6, src: '../../shared/audio/sfx-jingle.mp3',  vol: .55 },
  { at: 3.45,src: '../../shared/audio/sfx-wood.mp3',    vol: .45 },
  { at: 3.7, src: '../../shared/audio/sfx-wood.mp3',    vol: .45 },
  { at: 5.2, src: '../../shared/audio/sfx-click.mp3',   vol: .6 },
  { at: 5.3, src: '../../shared/audio/sfx-bell.mp3',    vol: .4 },
  { at: 6.6, src: '../../shared/audio/sfx-click.mp3',   vol: .6 },
  { at: 6.7, src: '../../shared/audio/sfx-pop.mp3',     vol: .4 },
  { at: 7.7, src: '../../shared/audio/sfx-sparkle.mp3', vol: .4 },
]};
const { $ } = MF;
const G = MF.garden($('#bg'), { seed: 21 });
const YT = MF.social($('#yt'), { platform: 'youtube', label: 'YouTube', user: '@Let.growww', b1: 'SUBSCRIBE', b2: '✓ SUBSCRIBED', color: '#FF0033' });
const IG = MF.social($('#ig'), { platform: 'instagram', label: 'Instagram', user: '@let.growww', b1: 'Follow', b2: '✓ Following', color: '#4F5BD5' });
$('#cur').innerHTML = MF.ICON.cursor;
const THX = MF.words($('#thx')), SUB = MF.words($('#sub'));
const R = MF.rand(5);
for (let i = 0; i < 14; i++) { const t = document.createElement('div'); t.className = 'tuft';
  t.innerHTML = `<svg viewBox="0 0 90 60"><path d="M10 60 Q 18 20 26 2 Q 30 30 34 60 M40 60 Q 46 14 58 0 Q 56 32 60 60 M62 60 Q 72 28 84 12 Q 76 40 74 60" fill="#7BAA48"/></svg>`;
  t.style.left = (i * 140 + R() * 60 - 40) + 'px'; t.style.top = (878 + R() * 20) + 'px'; $('#world').appendChild(t); }
const HR = Array.from({ length: 9 }, (_, i) => { const h = document.createElement('div'); h.className = 'hrt';
  h.innerHTML = i % 3 === 2 ? MF.leafSVG() : MF.ICON.heart; $('#stage').appendChild(h); return { el: h, dx: (R() - .5) * 220, up: 120 + R() * 120, d: R() * .4 }; });
// titik tombol (koordinat stage)
const BTN = { yt: [150 + 600, 660 + 85], ig: [990 + 640, 660 + 85] };

MF.boot({
  duration: 10,
  build(tl) {
    gsap.set('#world', { scale: 1.6, transformOrigin: '960px 330px' });
    gsap.set('#seed', { y: -700 });
    gsap.set('#stem', { strokeDasharray: 120, strokeDashoffset: 120 });
    gsap.set(['#lfL', '#lfR'], { scale: 0 });
    gsap.set('#badge', { clipPath: 'circle(0% at 50% 80%)' });
    gsap.set(THX, { scaleY: 0, opacity: 0 });
    gsap.set(SUB, { y: 30, opacity: 0 });
    gsap.set(['#yt', '#ig'], { y: 520 });
    gsap.set('#cur', { x: 2000, y: 1150 });
    // benih → tunas → maskot
    tl.to('#seed', { y: 0, duration: .38, ease: 'power2.in' }, .02)
      .to('#seed', { scaleY: .74, scaleX: 1.2, duration: .07, transformOrigin: '50% 100%' }, .4)
      .to('#seed', { scaleY: 1, scaleX: 1, duration: .4, ease: 'elastic.out(1,.45)' }, .47)
      .to('#stem', { strokeDashoffset: 0, duration: .4 }, .55)
      .to('#lfL', { scale: 1, duration: .4, ease: 'back.out(2.4)' }, .78)
      .to('#lfR', { scale: 1, duration: .4, ease: 'back.out(2.4)' }, .84)
      .to('#world', { scale: 1, duration: .8, ease: 'power3.inOut' }, 1.0)
      .to(['#seed', '#sprout'], { scale: .4, opacity: 0, duration: .4 }, 1.1)
      .to('#mound', { scaleY: 0, opacity: 0, transformOrigin: '50% 100%', duration: .45 }, 1.1)
      .to('#badge', { clipPath: 'circle(72% at 50% 50%)', duration: .6, ease: 'back.out(1.6)' }, 1.15);
    // terima kasih: kata tumbuh dari bawah
    THX.forEach((w, i) => tl.to(w, { scaleY: 1, opacity: 1, duration: .55, ease: 'elastic.out(1,.6)' }, 1.6 + i * .08));
    MF.blur(tl, THX, 1.6, .5, { from: 14 });
    SUB.forEach((w, i) => tl.to(w, { y: 0, opacity: 1, duration: .45, ease: 'power3.out' }, 2.45 + i * .05));
    MF.blur(tl, SUB, 2.45, .5, { from: 10 });
    // papan akun tumbuh dari tanah
    tl.to('#yt', { y: 0, duration: .55, ease: 'back.out(1.5)' }, 3.0)
      .to('#ig', { y: 0, duration: .55, ease: 'back.out(1.5)' }, 3.25)
      .fromTo(['#yt', '#ig'], { rotation: -2 }, { rotation: 0, duration: .6, ease: 'elastic.out(1,.4)', stagger: .25 }, 3.45);
    // kursor: SUBSCRIBE lalu Follow
    tl.to('#cur', { x: BTN.yt[0], y: BTN.yt[1], duration: .85, ease: 'power3.inOut' }, 4.3)
      .to('#cur', { scale: .85, duration: .08, yoyo: true, repeat: 1 }, 5.16)
      .fromTo(YT, { scale: 1 }, { scale: 1.05, duration: .12, yoyo: true, repeat: 1 }, 5.2)
      .fromTo('#rip', { x: BTN.yt[0], y: BTN.yt[1], scale: .4, opacity: .9 }, { scale: 4, opacity: 0, duration: .5, immediateRender: false }, 5.2)
      .to('#cur', { x: BTN.ig[0], y: BTN.ig[1], duration: .9, ease: 'power3.inOut' }, 5.6)
      .to('#cur', { scale: .85, duration: .08, yoyo: true, repeat: 1 }, 6.56)
      .fromTo(IG, { scale: 1 }, { scale: 1.05, duration: .12, yoyo: true, repeat: 1 }, 6.6)
      .fromTo('#rip', { x: BTN.ig[0], y: BTN.ig[1], scale: .4, opacity: .9 }, { scale: 4, opacity: 0, duration: .5, immediateRender: false }, 6.6)
      .to('#cur', { x: 2050, y: 1150, duration: .8, ease: 'power2.in' }, 7.1);
    HR.forEach((h, i) => tl.fromTo(h.el, { x: BTN.ig[0] - 22, y: BTN.ig[1] - 60, opacity: 0, scale: .4 },
      { x: BTN.ig[0] - 22 + h.dx, y: BTN.ig[1] - 60 - h.up, opacity: 1, scale: 1, duration: .7, ease: 'power2.out' }, 6.65 + h.d)
      .to(h.el, { opacity: 0, duration: .4 }, 7.35 + h.d));
    // maskot melompat kecil, kamera mendekat pelan
    tl.to('#badge', { y: -22, duration: .22, ease: 'power2.out', yoyo: true, repeat: 1 }, 7.6)
      .to('#world', { scale: 1.035, duration: 2, ease: 'sine.inOut' }, 7.5)
      .to('#blackout', { opacity: 1, duration: .7, ease: 'power1.in' }, 9.3);
  },
  render(t) { G.update(t); YT.classList.toggle('done', t >= 5.2); IG.classList.toggle('done', t >= 6.6); }
});
</script>
</body>
</html>
