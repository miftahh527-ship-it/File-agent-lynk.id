<!doctype html>
<html lang="id">
<!-- Motion Format — "Cuaca Aneh Akhir 2026" · video long 16:9 · Adegan 1 (hook). Gaya satelit (mengikuti video referensi). -->
<head>
<meta charset="utf-8">
<title>Cuaca Aneh 2026 — Adegan 1</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--tinta:#ffffff;--redup:rgba(255,255,255,.4);--air:#7fd6ff;--darat:#ffd46b;--bahaya:#ff8a5b;
  --f-teks:"Plus Jakarta Sans",system-ui,sans-serif}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;background:#0e3556;color:var(--tinta);font-family:var(--f-teks)}
#kam3d{position:absolute;inset:0;transform-origin:50% 62%}
#peta{position:absolute;inset:0;width:1920px;height:1080px;overflow:visible}
#kabut{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(170,205,225,.55),rgba(170,205,225,0) 38%);opacity:0}
#awanDekat{position:absolute;inset:0;pointer-events:none}
.awd{position:absolute;opacity:0;background-size:contain;background-repeat:no-repeat;filter:blur(10px)}
#hujan{position:absolute;inset:0;pointer-events:none;opacity:0}
.vinyet{position:absolute;inset:0;pointer-events:none;background:radial-gradient(80% 72% at 50% 50%,transparent 58%,rgba(0,12,24,.5) 100%)}
#lapisLabel{position:absolute;inset:0;pointer-events:none}
#lapisLabel svg{position:absolute;inset:0;overflow:visible}
.lt-garis{stroke:#fff;stroke-width:2;opacity:.9}.lt-titik{fill:#fff}
.denyut{fill:none;stroke-width:3}
.lt{position:absolute;font-weight:800;font-size:40px;line-height:1.15;white-space:nowrap;opacity:0;transform:translateX(-50%);text-align:center;text-shadow:0 2px 12px rgba(0,0,0,.7)}
.lt small{display:block;font-size:28px;font-weight:700;opacity:.9}
.air{color:var(--air)}.darat{color:var(--darat)}.bahaya{color:var(--bahaya)}
#caption{position:absolute;inset:0;pointer-events:none}
.frasa{position:absolute;max-width:1300px;font-weight:800;font-size:52px;line-height:1.26;opacity:0;text-wrap:balance;text-shadow:0 2px 16px rgba(0,0,0,.75)}
.frasa .k{display:inline-block;margin:0 .12em;color:var(--redup)}
#tengah{position:absolute;left:1180px;width:620px;top:300px;text-align:center;opacity:0;pointer-events:none}
#tengah .besar{font-weight:800;font-size:190px;line-height:1;color:var(--bahaya);text-shadow:0 6px 30px rgba(0,0,0,.55);font-variant-numeric:tabular-nums}
#tengah .besar small{font-size:76px;margin-left:12px}
#tengah .bawah{font-weight:800;font-size:52px;margin-top:14px;text-shadow:0 2px 12px rgba(0,0,0,.7)}
#tanya{position:absolute;left:960px;top:330px;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:4px solid #fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:76px;opacity:0;text-shadow:0 2px 12px rgba(0,0,0,.6);box-shadow:0 0 30px rgba(255,255,255,.35),inset 0 0 24px rgba(255,255,255,.2)}
#dbg{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:none;gap:12px;align-items:center;padding:10px 16px;border-radius:14px;background:rgba(14,16,22,.9);color:#cfd5e3;font:13px system-ui;z-index:50}
#dbg input{width:360px}#dbg span{font-variant-numeric:tabular-nums;min-width:6ch}
</style>
</head>
<body>
<div id="stage">
  <div id="kam3d" data-tata="latar"><svg id="peta" data-tata="latar" viewBox="0 0 7680 4320"></svg></div>
  <div id="kabut" data-tata="dekor"></div>
  <canvas id="hujan" width="1920" height="1080" data-tata="dekor"></canvas>
  <div id="awanDekat" data-tata="dekor"></div>
  <div class="vinyet" data-tata="dekor"></div>
  <div id="tanya">?</div>
  <div id="tengah"><div class="besar"><span id="angka">0</span><small>mm</small></div><div class="bawah">dalam <span class="bahaya">sehari</span></div></div>
  <div id="lapisLabel"><svg width="1920" height="1080" data-tata="dekor"></svg></div>
  <div id="caption"></div>
  <div id="dbg"><button id="dPlay">Pause</button><input id="dScrub" type="range" min="0" max="1000" value="0"><span id="dClock">0.00s</span></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
/*PETADATA*/
const $=s=>document.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const W=1920,H=1080,DUR=40,NS='http://www.w3.org/2000/svg';
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);$('#stage').style.transform=`translate(-50%,-50%) scale(${s})`;}
addEventListener('resize',fit);fit();
const tl=gsap.timeline({paused:true});
const rnd=(a,b)=>{const x=Math.sin(a*12.9898+b*78.233)*43758.5453;return x-Math.floor(x);};
const el=(tag,a={},p)=>{const n=document.createElementNS(NS,tag);for(const k in a)n.setAttribute(k,a[k]);if(p)p.appendChild(n);return n;};
const css=v=>getComputedStyle(document.body).getPropertyValue(v).trim();

/* ===== proyeksi (dunia.json: mercator, pusat 160°) — garis pantai asli Natural Earth 1:10m ===== */
function titikPeta(lon,lat){const R=Math.PI/180,x=(((lon-PETA.pusat[0]+540)%360)-180)*R,y=Math.log(Math.tan(Math.PI/4+Math.max(-85,Math.min(85,lat))*R/2));
  return [PETA.ukuran[0]/2+(x-PETA.tengah[0])*PETA.skala,PETA.ukuran[1]/2-(y-PETA.tengah[1])*PETA.skala];}
const SW=PETA.ukuran[0],SH=PETA.ukuran[1];

/* ===== tekstur satelit: noise berperiode (ridged) + bayangan bukit kuat ===== */
function medan(n,{seed=1,air=false,okt=[[3,.36],[6,.24],[12,.16],[24,.11],[48,.08],[96,.05]]}){const h=new Float32Array(n*n);
  for(const [L,amp] of okt){const g=[...Array(L*L)].map((_,i)=>rnd(seed*31+L,i));
    for(let y=0;y<n;y++)for(let x=0;x<n;x++){const fx=x*L/n,fy=y*L/n,x0=Math.floor(fx),y0=Math.floor(fy),tx=fx-x0,ty=fy-y0,
      sx=tx*tx*(3-2*tx),sy=ty*ty*(3-2*ty),G=(i,j)=>g[((j%L)*L)+(i%L)],
      v=(G(x0,y0)*(1-sx)+G(x0+1,y0)*sx)*(1-sy)+(G(x0,y0+1)*(1-sx)+G(x0+1,y0+1)*sx)*sy;
      h[y*n+x]+=amp*(air?v:Math.pow(1-Math.abs(2*v-1),1.6));}}
  return h;}
function warnai(n,h,{rendah,tinggi,bayang=1,kontras=1.2}){const cv=document.createElement('canvas');cv.width=cv.height=n;const cx=cv.getContext('2d'),img=cx.createImageData(n,n);
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){const i=y*n+x,dx=h[y*n+(x+1)%n]-h[y*n+(x+n-1)%n],dy=h[((y+1)%n)*n+x]-h[((y+n-1)%n)*n+x];
    const s=Math.max(.45,Math.min(1.4,1+(-dx*1.1-dy)*6*bayang)),t=Math.min(1,Math.max(0,(h[i]-.18)*kontras));
    for(let c=0;c<3;c++)img.data[i*4+c]=Math.min(255,(rendah[c]+(tinggi[c]-rendah[c])*t)*s);img.data[i*4+3]=255;}
  cx.putImageData(img,0,0);return cv.toDataURL('image/jpeg',.9);}
const HD=medan(512,{seed:3}),HA=medan(256,{seed:7,air:true,okt:[[4,.4],[8,.3],[16,.18],[32,.12]]}),HM=medan(256,{seed:11,air:true,okt:[[3,.5],[6,.3],[12,.2]]});
const UB_DARAT=warnai(512,HD,{rendah:[22,58,30],tinggi:[132,150,92],bayang:1.4,kontras:1.5});
const UB_KERING=warnai(512,HD,{rendah:[96,70,40],tinggi:[214,182,130],bayang:1.4,kontras:1.5});
const UB_AIR=warnai(256,HA,{rendah:[10,48,86],tinggi:[22,80,124],bayang:.25,kontras:1.2});
const UB_MAKRO=warnai(256,HM,{rendah:[120,150,96],tinggi:[255,248,222],bayang:0,kontras:1.6});

/* ===== awan: tekstur fbm berambang (bervolume, tepi berserat) ===== */
function teksturAwan(n,seed){const h=medan(n,{seed,air:true,okt:[[3,.45],[6,.25],[12,.15],[24,.09],[48,.06]]}),cv=document.createElement('canvas');cv.width=cv.height=n;
  const cx=cv.getContext('2d'),img=cx.createImageData(n,n);
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){const i=y*n+x,dx=(x-n/2)/(n/2),dy=(y-n/2)/(n/2),fall=Math.max(0,1-Math.sqrt(dx*dx+dy*dy));
    const v=h[i]*Math.pow(fall,.7)*1.7,a=Math.min(.95,Math.max(0,(v-.36)/.5)),sh=Math.max(.72,Math.min(1,1-(h[y*n+(x+1)%n]-h[i])*14));
    img.data[i*4]=img.data[i*4+1]=255*sh;img.data[i*4+2]=Math.min(255,262*sh);img.data[i*4+3]=255*a;}
  cx.putImageData(img,0,0);return cv.toDataURL('image/png');}
const AWT=[1,2,3,4].map(s=>teksturAwan(384,40+s*7));

/* ===== bangun peta ===== */
const svg=$('#peta'),defs=el('defs',{},svg),Z=[1,6,30];
function pola(id,href,size,rot=0){const p=el('pattern',{id,patternUnits:'userSpaceOnUse',width:size,height:size,patternTransform:`rotate(${rot})`},defs);el('image',{href,width:size,height:size,preserveAspectRatio:'none'},p);}
Z.forEach((z,i)=>{pola('darat'+i,UB_DARAT,900/z,31+i*17);pola('kering'+i,UB_KERING,900/z,31+i*17);pola('airp'+i,UB_AIR,1400/z,-12+i*9);pola('makro'+i,UB_MAKRO,5200/z,-23+i*11);});
const TINGKAT=[];
function lapisPola(d,jenis,induk,makro=true){Z.forEach((z,i)=>{const p=el('path',{d,fill:`url(#${jenis}${i})`},induk);TINGKAT.push({n:p,z});
  if(makro){const m=el('path',{d,fill:`url(#makro${i})`,style:'mix-blend-mode:multiply'},induk);TINGKAT.push({n:m,z});}});}
el('rect',{x:-SW*4,y:-SH*4,width:SW*9,height:SH*9,fill:'#0f3d63'},svg);
const gLaut=el('g',{},svg);lapisPola(`M${-SW*4} ${-SH*4}h${SW*9}v${SH*9}h${-SW*9}Z`,'airp',gLaut,false);
/* anomali suhu laut Pasifik */
const gradH=el('radialGradient',{id:'hangat'},defs);
[[0,'#ff3b1f',.95],[.35,'#ff6a2a',.8],[.7,'#ff9a3c',.4],[1,'#ffb04a',0]].forEach(([o,c,a])=>el('stop',{offset:o,'stop-color':c,'stop-opacity':a},gradH));
const [hx1,hy1]=titikPeta(-172,0),[hx2]=titikPeta(-82,0),[,hyN]=titikPeta(0,9);
const hangat=el('ellipse',{cx:(hx1+hx2)/2,cy:hy1,rx:0,ry:0,fill:'url(#hangat)',style:'mix-blend-mode:hard-light;filter:blur(22px)'},svg);
/* laut dangkal toska di sepanjang pantai (seperti terumbu di citra satelit) */
const HALO=el('path',{d:PANTAI,fill:'none',stroke:'#2bb3c0','stroke-width':14,opacity:.38,'stroke-linejoin':'round',style:'filter:blur(3px)'},svg);
el('path',{d:PANTAI,fill:'none',stroke:'#8fe6dc','stroke-width':3,opacity:.22,style:'filter:blur(1.5px)','stroke-linejoin':'round'},svg);
const gDarat=el('g',{},svg);lapisPola(PANTAI,'darat',gDarat);
/* lapisan kering (Nusa Tenggara, Sulawesi — kemarau) di atas darat, muncul saat dibutuhkan */
const gKeringIndo=el('g',{opacity:0},svg);lapisPola(PULAU.nusantara,'kering',gKeringIndo);
const gKeringTimur=el('g',{opacity:0},svg);lapisPola(PULAU.sulawesi+PULAU.nusatenggara,'kering',gKeringTimur);
/* awan dunia (ikut kamera) + bayangannya di permukaan */
const gBayang=el('g',{opacity:.55},svg),gAwan=el('g',{},svg);
const AWN=[];function awanDunia(lon,lat,ukuran,seed,zmin=0,zmax=99){const [x,y]=titikPeta(lon,lat),w=ukuran,h=ukuran*.7,src=AWT[seed%4];
  const b=el('image',{href:src,x:x-w/2+w*.06,y:y-h/2+h*.08,width:w,height:h,style:'filter:brightness(0) blur(3px)',opacity:.45},gBayang);
  const a=el('image',{href:src,x:x-w/2,y:y-h/2,width:w,height:h,opacity:.9},gAwan);AWN.push({a,b,zmin,zmax});}
function awanZoom(){for(const k of AWN){const f=Math.max(0,Math.min(1,Math.min((C.z-k.zmin)/(k.zmin*.4||1),(k.zmax-C.z)/(k.zmax*.3))));k.a.setAttribute('opacity',.9*f);k.b.setAttribute('opacity',.45*f);}}
[[-150,9,900],[-128,-7,760],[-176,-12,820],[172,13,700],[-102,15,720],[142,10,640],[-160,-20,860],[-138,20,700],[180,-4,620]].forEach((a,i)=>awanDunia(...a,i,0,5));  // Pasifik
[[95.2,2.6,46],[98.4,6.0,40],[99.9,1.4,52],[96.2,6.9,34],[101.6,3.6,44],[94.6,4.9,30]].forEach((a,i)=>awanDunia(...a,i+1,8,99));            // Sumatra utara
[[111.2,-6.2,40],[113.8,-9.0,46],[114.8,-6.4,32],[110.0,-8.7,36]].forEach((a,i)=>awanDunia(...a,i+2,8,99));                   // Jawa Timur
[[104,-1.5,150],[121,1.5,170],[128,-6.5,150],[110,4,140],[134,-2,150],[117,-10.4,120],[96,-4,130]].forEach((a,i)=>awanDunia(...a,i+3,2.6,11));       // Nusantara
const gTepi=el('g',{fill:'none','stroke-linejoin':'round'},svg);

/* ===== kamera = viewBox + kemiringan 3D (seperti referensi yang kadang menatap miring) ===== */
const C={x:SW/2,y:SH/2,z:1,tilt:0};
function vb(){const w=SW/C.z,h=SH/C.z;return [C.x-w/2,C.y-h/2,w,h];}
function applyCam(){const [x,y,w,h]=vb();svg.setAttribute('viewBox',`${x} ${y} ${w} ${h}`);
  for(const t of TINGKAT)t.n.setAttribute('opacity',t.z===1?1:Math.max(0,Math.min(1,(Math.log(C.z/t.z)+.7)/.7)));
  for(const g of TEPI)g.n.setAttribute('stroke-width',g.w*w/W);
  $('#kam3d').style.transform=`perspective(1500px) rotateX(${C.tilt}deg) scale(${1+C.tilt/90})`;HALO.setAttribute('stroke-width',Math.min(14,16*w/W));$('#kabut').style.opacity=C.tilt/30;awanZoom();drawLabels();}
const toScreen=(x,y)=>{const [vx,vy,w,h]=vb();return [(x-vx)/w*W,(y-vy)/h*H];};
function zoom(at,x,y,z,dur=2.2,ease='power2.inOut'){const o={x:C._x??C.x,y:C._y??C.y,l:Math.log(C._z??C.z)};C._x=x;C._y=y;C._z=z;
  const p={x:o.x,y:o.y,l:o.l};tl.fromTo(p,{x:o.x,y:o.y,l:o.l},{x,y,l:Math.log(z),duration:dur,ease,immediateRender:false,onUpdate(){C.x=p.x;C.y=p.y;C.z=Math.exp(p.l);applyCam();}},at);}
const miring=(at,deg,dur=2,ease='sine.inOut')=>tl.to(C,{tilt:deg,duration:dur,ease,onUpdate:applyCam},at);
function fokus(lon,lat,z,sx=W/2,sy=H/2){const [px,py]=titikPeta(lon,lat),w=SW/z;return [px-(sx-W/2)*w/W,py-(sy-H/2)*w/W,z];}

/* ===== garis tepi menyala ===== */
const TEPI=[];
function garisTepi(d,at,{warna='darat',w=3.5,dur=1.4,sampai=null}={}){const c=css('--'+warna)||warna;
  const n=el('path',{d,stroke:c,'stroke-width':w,opacity:0,style:`filter:drop-shadow(0 0 5px ${c})`},gTepi);const L=n.getTotalLength();
  n.style.strokeDasharray=L;TEPI.push({n,w});tl.set(n,{opacity:1},at);
  tl.fromTo(n,{strokeDashoffset:L},{strokeDashoffset:0,duration:dur,ease:'power1.inOut',immediateRender:false},at);
  if(sampai)tl.to(n,{opacity:0,duration:.4},sampai);return n;}

/* ===== label titik + denyut (ikut kamera) ===== */
const LBL=[],DNY=[];const lsvg=$('#lapisLabel svg');
function labelTitik(at,{lon,lat,teks,panjang=200,sampai,arah=-1}){const [x,y]=titikPeta(lon,lat);const d=document.createElement('div');d.className='lt';d.dataset.bolehTumpuk='';d.innerHTML=teks;$('#lapisLabel').appendChild(d);
  const ln=el('line',{class:'lt-garis'},lsvg),dot=el('circle',{class:'lt-titik',r:0},lsvg),L={x,y,d,ln,dot,panjang,arah,p:{v:0}};LBL.push(L);
  tl.fromTo(L.p,{v:0},{v:1,duration:.5,ease:'power2.out',immediateRender:false,onUpdate:drawLabels},at);
  tl.fromTo(d,{opacity:0},{opacity:1,duration:.35,immediateRender:false},at+.15);
  if(sampai){tl.to(d,{opacity:0,duration:.3},sampai);tl.to(L.p,{v:0,duration:.3,onUpdate:drawLabels},sampai);}return L;}
function denyut(at,{lon,lat,sampai,warna='--air',n=3}){const [x,y]=titikPeta(lon,lat);
  for(let i=0;i<n;i++){const c=el('circle',{class:'denyut',r:0,opacity:0,style:`stroke:var(${warna})`},lsvg),D={x,y,c,p:{v:0}};DNY.push(D);
    const per=1.6,mulai=at+i*per/n,ulang=Math.max(0,Math.floor((sampai-mulai)/per)-1);
    tl.fromTo(D.p,{v:0},{v:1,duration:per,ease:'none',repeat:ulang,immediateRender:false,onUpdate:drawLabels},mulai);
    tl.set(D.p,{v:0,onUpdate:drawLabels},sampai);}}
function drawLabels(){for(const L of LBL){const [sx,sy]=toScreen(L.x,L.y),ty=sy+L.arah*L.panjang*L.p.v,cx=Math.max(260,Math.min(W-260,sx));
  L.ln.setAttribute('x1',sx);L.ln.setAttribute('y1',sy);L.ln.setAttribute('x2',sx);L.ln.setAttribute('y2',ty);L.ln.setAttribute('opacity',L.p.v>0?.9:0);
  L.dot.setAttribute('cx',sx);L.dot.setAttribute('cy',sy);L.dot.setAttribute('r',6*Math.min(1,L.p.v*2));
  L.d.style.left=cx+'px';L.d.style.top=(L.arah<0?ty-L.d.offsetHeight-8:ty+8)+'px';}
  for(const D of DNY){const [sx,sy]=toScreen(D.x,D.y),v=D.p.v;D.c.setAttribute('cx',sx);D.c.setAttribute('cy',sy);D.c.setAttribute('r',12+v*80);D.c.setAttribute('opacity',v>0?(1-v)*.95:0);}}

/* ===== caption karaoke: berpindah ke dekat subjek seperti referensi (atas / bawah) ===== */
const ATAS={x:W/2,y:110},BAWAH={x:W/2,y:838};
const NASKAH=[
  {at:.5, sampai:3.4, teks:'Tahun ini, ilmuwan iklim dunia kaget', kunci:{'iklim':'air'}, pos:BAWAH},
  {at:3.7,sampai:7.4, teks:'Lautan Pasifik memanas sampai memecahkan rekor', kunci:{'Pasifik':'air','rekor':'bahaya'}, pos:BAWAH},
  {at:7.7,sampai:10.2,teks:'Fenomena yang namanya El Niño ini', kunci:{'El':'bahaya','Niño':'bahaya'}, pos:ATAS},
  {at:10.3,sampai:13.0,teks:'biasanya bikin Indonesia kering kerontang', kunci:{'Indonesia':'darat','kering':'bahaya','kerontang':'bahaya'}, pos:ATAS},
  {at:13.3,sampai:15.8,teks:'Tapi coba lihat berita minggu-minggu terakhir', kunci:{}, pos:BAWAH},
  {at:16.0,sampai:17.7,teks:'Banjir di Aceh', kunci:{'Banjir':'air','Aceh':'darat'}, pos:BAWAH},
  {at:17.9,sampai:19.7,teks:'Banjir di Langkat', kunci:{'Banjir':'air','Langkat':'darat'}, pos:BAWAH},
  {at:20.0,sampai:24.8,teks:'Hujan 358 milimeter dalam sehari di Jawa Timur', kunci:{'358':'bahaya','milimeter':'bahaya','Jawa':'darat','Timur':'darat'}, pos:BAWAH},
  {at:25.2,sampai:27.6,teks:'Kok bisa, kemarau panjang dan banjir', kunci:{'kemarau':'bahaya','banjir':'air'}, pos:BAWAH},
  {at:27.7,sampai:30.4,teks:'terjadi di tahun yang sama?', kunci:{}, pos:BAWAH},
  {at:30.8,sampai:33.8,teks:'Di video ini, kita bongkar pelan-pelan', kunci:{}, pos:ATAS},
  {at:34.1,sampai:36.5,teks:'Dan di akhir, ada hal penting', kunci:{'penting':'bahaya'}, pos:ATAS},
  {at:36.6,sampai:39.4,teks:'yang perlu kamu siapkan sebelum Desember', kunci:{'Desember':'bahaya'}, pos:ATAS}];
const suku=w=>Math.max(1,(w.toLowerCase().match(/[aiueoñ]+/g)||[]).length+(/\d/.test(w)?w.replace(/\D/g,'').length*.6:0));
function caption(){const box=$('#caption'),putih=css('--tinta');
  NASKAH.forEach(f=>{const d=document.createElement('div');d.className='frasa';const ws=f.teks.split(/\s+/),pos=f.pos||BAWAH;
    ws.forEach(w=>{const s=document.createElement('span');s.className='k';s.textContent=w;d.appendChild(s);});box.appendChild(d);

/* ---------- kontrol: autoplay + loop tanpa player; ?debug=1; ?clean=1 ---------- */
const q=new URLSearchParams(location.search);
function start(){tl.play(0);}
tl.eventCallback('onComplete',()=>start());
window.OPENER={W,H,DURATION:DUR,tl,ready:false,seek(t){tl.pause(t,false);applyCam();if(gsap.ticker.tick)gsap.ticker.tick();},play:start};
window.OPENER.seekFrame=function(t){window.OPENER.seek(t);return Promise.resolve();};
addEventListener('keydown',e=>{if(/^[rR]$/.test(e.key))start();if(e.code==='Space'){e.preventDefault();tl.paused()?tl.play():tl.pause();}});
if(q.has('debug')){const dbg=$('#dbg');dbg.style.display='flex';const sc=$('#dScrub'),ck=$('#dClock');let drag=false;
  gsap.ticker.add(()=>{if(!drag)sc.value=String(tl.time()/DUR*1000);ck.textContent=tl.time().toFixed(2)+'s';$('#dPlay').textContent=tl.paused()?'Play':'Pause';});
  sc.addEventListener('pointerdown',()=>{drag=true;tl.pause();});addEventListener('pointerup',()=>drag=false);
  sc.addEventListener('input',()=>{tl.pause();tl.time(sc.value/1000*DUR);});$('#dPlay').onclick=()=>tl.paused()?tl.play():tl.pause();}
/* SUARA (diisi setelah gambar disetujui): VO ElevenLabs per paragraf + musik pelan + SFX */
window.AUDIO_PLAN = window.AUDIO_PLAN || { vo: [], sfx: [], music: null };
var MF=(function(){var P=window.AUDIO_PLAN,T=window.OPENER.tl,on=false,last=0,noop=function(){};
  function mk(s,music){var a=new Audio(s.src);a.preload='auto';a.volume=s.vol==null?(music?.15:1):s.vol;return{at:s.at||0,el:a,music:!!music};}
  var LONG=(P.vo||[]).map(function(s){return mk(s);}).concat(P.music?[mk(P.music,true)]:[]),SFX=(P.sfx||[]).map(function(s){return mk(s);}),ALL=LONG.concat(SFX);
  addEventListener('pointerdown',function(){on=true;},{once:true});addEventListener('keydown',function(){on=true;},{once:true});
  gsap.ticker.add(function(){var t=T.time(),playing=!T.paused();if(!on){last=t;return;}
    for(var i=0;i<LONG.length;i++){var c=LONG[i],d=c.el.duration,rel=t-c.at,inside=rel>=0&&(c.music||!d||!isFinite(d)||rel<d);
      if(playing&&inside){var want=c.music&&d&&isFinite(d)?rel%d:rel;if(Math.abs(c.el.currentTime-want)>.25)c.el.currentTime=want;if(c.el.paused)c.el.play().catch(noop);}
      else if(!c.el.paused)c.el.pause();}
    if(playing){if(t<last)last=-.001;if(t-last<.5)for(var j=0;j<SFX.length;j++){var s=SFX[j];if(s.at>last&&s.at<=t){s.el.currentTime=0;s.el.play().catch(noop);}}}
    last=t;});
  return{has:ALL.length>0,probe:function(){var a=ALL[0].el,v=a.volume;a.volume=0;return a.play().then(function(){a.pause();a.currentTime=0;a.volume=v;on=true;},function(e){a.volume=v;throw e;});}};})();
document.fonts.ready.then(()=>{applyCam();window.OPENER.ready=true;if(q.has('clean'))return;
  if(!MF.has){start();return;}
  MF.probe().then(()=>tl.play(0)).catch(()=>{const go=()=>{removeEventListener('pointerdown',go);removeEventListener('keydown',go);start();};addEventListener('pointerdown',go);addEventListener('keydown',go);});});
