/* ===== INTI Motion Format (dari starter skill motion-format; dipasang ke tiap video oleh _src/build.py) =====
   Butuh: W, H, DUR, window.AUDIO_PLAN didefinisikan sebelum blok ini, GSAP sudah dimuat.
   Menyediakan: $, $$, tl, makeBlur/blurTween, VERT/HORZ, splitChars, splitWords, everyFrame(fn), finish().
   Hukum #2: semua visual adalah fungsi dari tl.time() — tidak ada Date.now()/Math.random(). */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const Q=new URLSearchParams(location.search);
const stageEl=$('#stage');
const fit=()=>{const s=Math.min(innerWidth/W,innerHeight/H);stageEl.style.transform=`translate(-50%,-50%) scale(${s})`;};
addEventListener('resize',fit);fit();

/* motion blur berarah: feGaussianBlur dengan stdDeviation x/y terpisah */
const defs=$('#filters defs');let fc=0;
function makeBlur(){const id='mb'+(fc++),NS='http://www.w3.org/2000/svg';const f=document.createElementNS(NS,'filter');f.id=id;
  f.setAttribute('x','-70%');f.setAttribute('y','-70%');f.setAttribute('width','240%');f.setAttribute('height','240%');
  const g=document.createElementNS(NS,'feGaussianBlur');g.setAttribute('stdDeviation','0 0');f.appendChild(g);defs.appendChild(f);
  return {url:`url(#${id})`,node:g};}
function blurTween(tl,targets,at,from,to,dur,{ease='power3.out',ax=1,ay=.08}={}){const b=makeBlur(),o={v:from};
  tl.set(targets,{filter:b.url},at);
  tl.to(o,{v:to,duration:dur,ease,onUpdate(){b.node.setAttribute('stdDeviation',`${(o.v*ax).toFixed(2)} ${(o.v*ay).toFixed(2)}`);}},at);
  tl.set(targets,{filter:'none'},at+dur);}
const VERT={ax:.1,ay:1},HORZ={ax:1,ay:.1};

/* pecah teks per huruf (.ch) dan per kata (.wd) */
function splitChars(el){const words=(el.textContent||'').trim().split(/\s+/);el.textContent='';const out=[];
  words.forEach((w,i)=>{const wr=document.createElement('span');wr.className='wd';
    for(const c of w){const s=document.createElement('span');s.className='ch';s.textContent=c;wr.appendChild(s);out.push(s);}
    el.appendChild(wr);if(i<words.length-1)el.appendChild(document.createTextNode(' '));});
  return out;}
function splitWords(el){const words=(el.textContent||'').trim().split(/\s+/);el.textContent='';
  return words.map((w,i)=>{const s=document.createElement('span');s.className='wd';s.textContent=w;el.appendChild(s);
    if(i<words.length-1)el.appendChild(document.createTextNode(' '));return s;});}

const tl=gsap.timeline({paused:true});
/* gerak per frame yang deterministik (ayunan, partikel, putaran): fungsi murni dari t */
const FRAME=[];const everyFrame=fn=>FRAME.push(fn);const runFrame=t=>{for(const f of FRAME)f(t);};
gsap.ticker.add(()=>runFrame(tl.time()));
/* angka seed tetap (pengganti Math.random) */
const seeded=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);};

function finish(){
  tl.set({},{},DUR);
  const start=()=>tl.play(0);
  tl.eventCallback('onComplete',start);                                   // default: loop
  const seek=t=>{tl.pause();tl.time(t,false);if(gsap.ticker.tick)gsap.ticker.tick();runFrame(t);};
  window.OPENER={W,H,DURATION:DUR,tl,seek,ready:false,seekFrame:t=>{seek(t);return Promise.resolve();}};
  addEventListener('keydown',e=>{if(/^[rR]$/.test(e.key))start();if(e.code==='Space'){e.preventDefault();tl.paused()?tl.play():tl.pause();}});
  if(Q.has('debug')){const d=document.createElement('div');d.id='dbg';
    d.innerHTML='<button id="dPlay">Pause</button><input id="dScrub" type="range" min="0" max="1000" value="0"><span id="dClock">0.00s</span>';
    document.body.appendChild(d);const sc=$('#dScrub'),ck=$('#dClock');let drag=false;
    gsap.ticker.add(()=>{if(!drag)sc.value=String(tl.time()/DUR*1000);ck.textContent=tl.time().toFixed(2)+'s';$('#dPlay').textContent=tl.paused()?'Play':'Pause';});
    sc.addEventListener('pointerdown',()=>{drag=true;tl.pause();});addEventListener('pointerup',()=>drag=false);
    sc.addEventListener('input',()=>{tl.pause();tl.time(sc.value/1000*DUR);runFrame(tl.time());});$('#dPlay').onclick=()=>tl.paused()?tl.play():tl.pause();}
  /* SUARA Motion Format — VO + efek suara terikat timeline (ikut scrub, pause, loop; dibaca render_mp4.py) */
  const P=window.AUDIO_PLAN||{vo:[],sfx:[],music:null};let on=false,last=0;const noop=()=>{};
  const mk=(s,music)=>{const a=new Audio(s.src);a.preload='auto';a.volume=s.vol==null?(music?.15:1):s.vol;return {at:s.at||0,el:a,music:!!music};};
  const LONG=(P.vo||[]).map(s=>mk(s)).concat(P.music?[mk(P.music,true)]:[]),SFX=(P.sfx||[]).map(s=>mk(s)),ALL=LONG.concat(SFX);
  const unlock=()=>{on=true;};addEventListener('pointerdown',unlock,{once:true});addEventListener('keydown',unlock,{once:true});
  gsap.ticker.add(()=>{const t=tl.time(),playing=!tl.paused();if(!on){last=t;return;}
    for(const c of LONG){const d=c.el.duration,rel=t-c.at,inside=rel>=0&&(c.music||!d||!isFinite(d)||rel<d);
      if(playing&&inside){const want=c.music&&d&&isFinite(d)?rel%d:rel;if(Math.abs(c.el.currentTime-want)>.25)c.el.currentTime=want;if(c.el.paused)c.el.play().catch(noop);}
      else if(!c.el.paused)c.el.pause();}
    if(playing){if(t<last)last=-.001;if(t-last<.5)for(const s of SFX)if(s.at>last&&s.at<=t){s.el.currentTime=0;s.el.play().catch(noop);}}
    last=t;});
  const probe=()=>{const a=ALL[0].el,v=a.volume;a.volume=0;return a.play().then(()=>{a.pause();a.currentTime=0;a.volume=v;on=true;},e=>{a.volume=v;throw e;});};
  document.fonts.ready.then(()=>{seek(0);window.OPENER.ready=true;if(Q.has('clean'))return;
    if(!ALL.length){start();return;}
    probe().then(start).catch(()=>{tl.pause(0);const go=()=>{removeEventListener('pointerdown',go);removeEventListener('keydown',go);start();};
      addEventListener('pointerdown',go);addEventListener('keydown',go);});});
}

const NS='http://www.w3.org/2000/svg';
/* ---------- aset berulang (grid biji, molekul, biji tuang) ---------- */
const beanSVG=(fill,crease)=>`<svg viewBox="0 0 80 100" width="80" height="100" style="overflow:visible"><ellipse cx="40" cy="50" rx="30" ry="42" fill="${fill}"/><path d="M38 12 C56 36 22 62 42 90" stroke="${crease}" stroke-width="6" fill="none" stroke-linecap="round"/></svg>`;
{const g=$('#a1grid');for(let i=0;i<12;i++){const d=document.createElement('div');d.className='gb';d.style.cssText=`position:absolute;left:${(i%4)*105+12}px;top:${Math.floor(i/4)*135+8}px;transform:rotate(${(seeded(i)-.5)*50}deg);opacity:0;filter:drop-shadow(0 8px 10px rgba(42,26,18,.22))`;d.innerHTML=beanSVG('#A9B98A','#7E8F60');g.appendChild(d);}}
{const g=$('#a2pour');for(let i=0;i<7;i++){const d=document.createElement('div');d.className='pb';d.style.cssText=`position:absolute;left:${60+(seeded(i+5)-.5)*60}px;top:0;transform:scale(.55)`;d.innerHTML=beanSVG('#A9B98A','#7E8F60');g.appendChild(d);}}
{const g=$('#a4mol');for(let i=0;i<30;i++){const d=document.createElement('div');const c=['#B5532E','#2E5A3C','#D9A55B'][i%3];
  d.className='mol';d.style.cssText=`position:absolute;left:${seeded(i+20)*760}px;top:${seeded(i+60)*250}px;opacity:0`;
  d.innerHTML=`<svg viewBox="-24 -24 48 48" width="44" height="44"><path d="M0 -20 L17 -10 L17 10 L0 20 L-17 10 L-17 -10Z" fill="none" stroke="${c}" stroke-width="5"/><circle r="5" fill="${c}"/></svg>`;g.appendChild(d);}}

/* ---------- pecah kalimat per kata (sorotan tetap satu span) ---------- */
$$('.line').forEach(el=>{const out=[];el.childNodes.forEach(n=>{if(n.nodeType===3){n.textContent.split(/\s+/).filter(Boolean).forEach(w=>{const s=document.createElement('span');s.className='w';s.textContent=w;out.push(s);});}
  else{const s=document.createElement('span');s.className='w';s.appendChild(n.cloneNode(true));out.push(s);}});el.textContent='';out.forEach(s=>el.appendChild(s));});

/* ---------- perkakas gaya kolase (dari starter) ---------- */
const words=el=>$$('.w',el);
const say=(sel,at,{dur=.55,st=.08}={})=>{const el=$(sel),ws=words(el);tl.set(el,{opacity:1},at);
  tl.fromTo(ws,{opacity:0,yPercent:60,scaleY:1.25},{opacity:1,yPercent:0,scaleY:1,duration:dur,ease:'power4.out',stagger:st,immediateRender:false},at);
  blurTween(tl,el,at,22,0,dur+st*ws.length,VERT);
  $$('.hl i',el).forEach((h,i)=>tl.fromTo(h,{scaleX:0},{scaleX:1,duration:.4,ease:'power3.out',immediateRender:false},at+st*ws.length+.15+i*.2));};
const unsay=(sel,at,{dur=.3}={})=>{const el=$(sel),ws=words(el);tl.to(ws,{opacity:0,yPercent:-50,duration:dur,ease:'power2.in',stagger:.02},at);
  blurTween(tl,el,at,0,30,dur+.1,{ease:'power2.in',...VERT});tl.set(el,{opacity:0},at+dur+.15);};
const fly=(sel,at,{from={x:0,y:500,rotate:10,scale:.9},dur=.9,ease='power4.out'}={})=>{const el=$(sel);
  tl.fromTo(el,{opacity:0,...from},{opacity:1,x:0,y:0,rotate:0,scale:1,duration:dur,ease,immediateRender:false},at);
  blurTween(tl,el,at,34,0,dur*.7,Math.abs(from.x||0)>Math.abs(from.y||0)?HORZ:VERT);};
const flyOut=(sel,at,{to={x:0,y:-700,rotate:-8,scale:1.1},dur=.45}={})=>{const el=$(sel);tl.to(el,{opacity:0,...to,duration:dur,ease:'power2.in'},at);
  blurTween(tl,el,at,0,50,dur+.1,{ease:'power2.in',...VERT});};
const label=(sel,at)=>tl.fromTo($(sel),{opacity:0,y:14},{opacity:1,y:0,duration:.45,ease:'power3.out',immediateRender:false},at);
const unlabel=(sel,at)=>tl.to($(sel),{opacity:0,duration:.25},at);
const slam=(sel,at)=>{tl.fromTo(sel,{opacity:0,scale:2.4,rotate:-24},{opacity:1,scale:1,rotate:-12,duration:.32,ease:'power4.in',immediateRender:false},at);
  tl.to(sel,{scale:1.06,duration:.1,yoyo:true,repeat:1},at+.32);};
const prep=el=>{const L=el.getTotalLength();el.style.strokeDasharray=L;el.style.strokeDashoffset=L;return L;};
const drawPath=(el,at,dur,ease='power2.inOut')=>{prep(el);tl.to(el,{strokeDashoffset:0,duration:dur,ease},at);};
/* keluarkan semua isi adegan dengan cepat (keluar asimetris: 0,35–0,5 dtk) */
const clearScene=(at,cuts,txt)=>{cuts.forEach((c,i)=>flyOut(c,at+i*.05,{to:{x:0,y:-620,rotate:-6,scale:1.08}}));txt.forEach(s=>$(s).classList.contains('line')?unsay(s,at):unlabel(s,at));};

/* ---------- kamera (rig #world): titik fokus dunia + zoom ---------- */
const rig=$('#world'),C={x:960,y:540,z:1};
const applyCam=()=>{rig.style.transform=`translate(${960-C.x*C.z}px,${540-C.y*C.z}px) scale(${C.z})`;};
const look=(at,x,y,z,dur=1.4,ease='sine.inOut')=>tl.to(C,{x,y,z,duration:dur,ease,onUpdate:applyCam},at);
const home=(at,x,y,dur=1.0)=>look(at,x,y,1,dur,'power2.inOut');
const into=(cutAt,x,y,z)=>tl.to(C,{x,y,z,duration:.9,ease:'power2.in',onUpdate:applyCam},cutAt-.9);
const settle=(cutAt,x,y,z)=>{tl.set(C,{x,y,z,onUpdate:applyCam},cutAt);tl.to(C,{z:z*.93,duration:1.1,ease:'power3.out',onUpdate:applyCam},cutAt);};
const breath=(a,b,z)=>tl.to(C,{z,duration:b-a,ease:'sine.inOut',onUpdate:applyCam},a);

/* ================= ADEGAN 1 — biji mentah (VO1 0,6–9,1) ================= */
tl.set(C,{x:440,y:390,z:1.5,onUpdate:applyCam},0);
tl.set(['#a6bar','#a3mix .sug','#a3mix .pro','#a3spk .spk','#a2flame'],{opacity:0},0);   // keadaan awal: tersembunyi sampai gilirannya
fly('#a1bean',.3);
look(1.5,970,410,1.32,1.3);                                        // meluncur ke tumpukan biji (skala)
tl.fromTo('#a1grid .gb',{opacity:0,scale:.3},{opacity:1,scale:1,duration:.5,ease:'back.out(2)',stagger:.06,immediateRender:false},1.7);
home(2.9,960,540);                                                 // zoom out selesai 3,9 → baru teks
say('#a1line',4.0);
fly('#a1nut',7.2,{from:{x:600,y:0,rotate:14,scale:.9}});           // "lebih mirip kacang rebus"
label('#a1hand',7.75);
breath(3.9,8.9,1.04);
clearScene(8.9,['#a1bean','#a1grid','#a1nut'],['#a1line','#a1hand']);
into(9.84,560,360,1.9);                                            // push-through ke adegan 2

/* ================= ADEGAN 2 — mesin sangrai (VO2 9,84–15,6) ================= */
settle(9.84,2860,400,1.55);
fly('#a2drum',9.84,{from:{x:0,y:420,rotate:6,scale:.92},dur:.8});
tl.fromTo('#a2flame',{opacity:0,scaleY:.2},{opacity:1,scaleY:1,duration:.6,ease:'back.out(2)',immediateRender:false},10.5);
look(11.5,3465,400,1.35,1.3);                                      // "suhunya naik pelan" → termometer
fly('#a2therm',11.6,{from:{x:500,y:0,rotate:-10,scale:.9},dur:.8});
tl.fromTo('#merc',{attr:{y:440,height:50}},{attr:{y:60,height:430},duration:3.3,ease:'sine.inOut',immediateRender:false},12.0);
home(12.85,3160,540);
{const o={v:25};tl.fromTo(o,{v:25},{v:200,duration:1.4,ease:'power2.out',immediateRender:false,onUpdate(){$('#a2num').textContent='±'+Math.round(o.v);}},13.9);}
say('#a2line',13.9);label('#a2name',14.4);
breath(13.85,15.5,1.035);
clearScene(15.45,['#a2drum','#a2therm','#a2flame'],['#a2line','#a2name']);
into(16.34,2860,430,2.3);

/* ================= ADEGAN 3 — di dalam biji (VO3 16,34–25,4) ================= */
settle(16.34,4960,410,1.5);
fly('#a3sec',16.34,{from:{x:0,y:0,rotate:0,scale:.55},dur:.8,ease:'expo.out'});
tl.fromTo('#a3mix .sug,#a3mix .pro',{opacity:0},{opacity:1,duration:.3,stagger:.1,immediateRender:false},17.6);
tl.fromTo('#a3spk .spk',{opacity:0},{opacity:1,duration:.15,stagger:.25,immediateRender:false},18.6);
look(18.2,5160,450,1.22,1.4);
home(19.4,5360,540);                                                // diam 20,4 → teks
label('#a3name',20.45);say('#a3line',20.6);
fly('#a3toast',22.65,{from:{x:620,y:-80,rotate:18,scale:.9}});
label('#a3hand',23.3);
breath(20.4,24.9,1.035);
clearScene(24.85,['#a3sec','#a3toast'],['#a3line','#a3name','#a3hand']);

/* ================= ADEGAN 4 — aroma + karamel (VO4 26,13–34,5) — tilt turun ================= */
look(25.2,5250,1820,1.32,1.0,'power2.inOut');
fly('#a4bean',25.45,{from:{x:0,y:400,rotate:8,scale:.9},dur:.8});
$$('#a4aroma path').forEach((p,i)=>{drawPath(p,26.4+i*.2,1.1,'sine.out');});
tl.fromTo('#a4mol .mol',{opacity:0,scale:.2},{opacity:1,scale:1,duration:.4,ease:'back.out(2.4)',stagger:{each:.035,from:'center'},immediateRender:false},28.0);
home(28.4,5360,1840);
say('#a4line',29.45);
fly('#a4car',30.16,{from:{x:0,y:-500,rotate:-10,scale:.9},dur:.75,ease:'bounce.out'});
label('#a4hand',32.45);
breath(29.4,34.0,1.035);
clearScene(33.95,['#a4bean','#a4car','#a4mol'],['#a4line','#a4hand']);
tl.to('#a4aroma',{opacity:0,duration:.3},33.95);

/* ================= ADEGAN 5 — first crack (VO5 35,19–42,3) — meluncur ke kanan ================= */
look(34.3,7560,1720,1.4,1.1,'power2.inOut');
fly('#a5bean',34.9,{from:{x:500,y:0,rotate:12,scale:.9},dur:.75});
tl.set('#a5arrows path',{opacity:0},0);tl.set('#a5crack',{opacity:0},0);
tl.to('#a5drops circle',{scale:1.5,opacity:0,duration:.6,stagger:.18,transformOrigin:'50% 50%'},35.6);
tl.fromTo('#a5arrows path',{opacity:0,scale:.4},{opacity:1,scale:1,duration:.4,ease:'back.out(2)',stagger:.2,transformOrigin:'50% 50%',immediateRender:false},36.1);

tl.set('#a5crack',{opacity:1},38.5);drawPath($('#a5crack'),38.5,.18,'power4.out');
tl.to('#a5L',{x:-18,rotation:-4,duration:.12,ease:'power3.out',svgOrigin:'260 560'},38.55);tl.to('#a5R',{x:18,rotation:4,duration:.12,ease:'power3.out',svgOrigin:'260 560'},38.55);
slam('#a5stamp',38.4);

look(42.2,7560,470,1.18,1.2,'power2.inOut');

/* ================= ADEGAN 7 — cangkir (VO7 54,25–59,3) ================= */
settle(54.25,9620,400,1.45);
fly('#a7cup',54.25,{from:{x:0,y:0,rotate:0,scale:.6},dur:.8,ease:'expo.out'});
$$('#a7steam path').forEach((p,i)=>drawPath(p,54.9+i*.2,1.2,'sine.out'));
tl.fromTo('#a7stk',{opacity:0,scale:2.2,rotate:-30},{opacity:1,scale:1,rotate:8,duration:.35,ease:'power4.in',immediateRender:false},55.6);
home(56.1,9760,540);
say('#a7line',57.25);
breath(57.1,61,1.04);
tl.to('#fade',{opacity:1,duration:.5,ease:'power2.in'},60.45);

/* ---------- gerak per frame (fungsi murni dari t) ---------- */
const ROAST=['#9FB37F','#C9A36A','#8A552F','#3E2416'];
const hx=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16));
const mix=(a,b,k)=>'#'+hx(a).map((v,i)=>Math.round(v+(hx(b)[i]-v)*k).toString(16).padStart(2,'0')).join('');
const roast=p=>{p=Math.max(0,Math.min(1,p))*3;const i=Math.min(2,Math.floor(p));return mix(ROAST[i],ROAST[i+1],p-i);};
const FL=$$('.cut .fl'),SUG=$$('#a3mix .sug'),PRO=$$('#a3mix .pro'),PB=$$('#a2pour .pb'),RB=$$('#a6b1 .rb,#a6b2 .rb,#a6b3 .rb');
everyFrame(t=>{
  /* aset terasa hidup: ayunan ±24 px, putaran ±1,5°, fase berbeda per objek */
  FL.forEach((f,i)=>{const ph=i*1.37,sp=1/(1.4+(i%4)*.12);f.style.transform=`translate(${Math.sin(t*sp*1.3+ph)*10}px,${Math.sin(t*sp*Math.PI+ph)*24}px) rotate(${Math.sin(t*sp*2+ph)*1.5}deg)`;});
  /* api di bawah drum berkedip */
  $('#a2flame').style.transform=`scaleY(${1+Math.sin(t*13)*.08+Math.sin(t*7.3)*.06})`;
  /* biji hijau dituang ke corong drum (10,0–11,6) */
  PB.forEach((b,i)=>{const ph=(t-10.0)*1.4-i*.14;b.style.opacity=(ph>0&&ph<1&&t<11.7)?1:0;b.style.top=(Math.max(0,Math.min(1,ph))*330)+'px';});
  /* gula dan protein bergerak di dalam biji, saling menabrak */
  SUG.forEach((g,i)=>g.setAttribute('transform',`translate(${280+Math.sin(t*1.9+i*2.1)*110} ${290+Math.cos(t*1.5+i*1.7)*140}) rotate(${t*40+i*30})`));
  PRO.forEach((g,i)=>g.setAttribute('transform',`translate(${280+Math.cos(t*1.6+i*2.4)*100} ${290+Math.sin(t*1.8+i*1.3)*150}) rotate(${Math.sin(t+i)*40})`));
  /* biji adegan 6: warnanya menyangrai bertahap (kiri berhenti di terang, tengah di sedang, kanan di gelap) */
  const pr=(t-43.3)/3.0;RB.forEach((e,i)=>e.setAttribute('fill',roast(Math.min(pr,[1/3,2/3,1][i]))));
});
finish();
</script>
